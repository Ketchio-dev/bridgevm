GraphicsBackend = 1 (DIRECT3D11)
# 3 = both FPS and speed in the on-screen counter. The host cannot measure guest
# frame rate: RESOURCE_FLUSH is issued by the desktop compositor on ctx 0, while
# the title renders on its own context, so the flush rate counts DWM's scanout
# rather than this application's frames.
ShowFPSCounter = 3
FullScreen = False
