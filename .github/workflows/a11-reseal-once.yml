name: One-shot A11 reseal

on:
  push:
    branches:
      - fix/a11-reseal-810b2ac

permissions:
  contents: write

jobs:
  reseal:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Update the exact-head A11 seal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          head = "810b2ac1c736470bece221477c9fc4385f5916de"
          path = Path("capabilities/windows-hvf.json")
          registry = json.loads(path.read_text())
          registry["reviewed"] = "2026-08-28"
          registry["tested_commit"] = head
          a11 = next(c for c in registry["criteria"] if c["id"] == "A11")
          a11["measured"] = (
              "Re-proven 2026-08-28 at final head " + head + ". GitHub-hosted CI run "
              "33177402203 passed rustfmt, workspace tests on macOS 15 and macOS 26, "
              "all-target clippy with warnings denied, MSRV 1.85, Linux-stub cross-check, "
              "native Venus checks/tests/host probe/device smoke, structural budgets, "
              "capability/documentation gates, and the complete macOS app build plus "
              "Swift and XCTest-shim suites. Security and quality run 33177402220 passed "
              "fuzz corpus smoke with the refreshed standalone lockfile, all Loom models, "
              "graphics-claim checks, live-gate policy, and supply-chain policy. Diagnostic "
              "post-performance audit run 33178479268 independently passed exact-head "
              "workspace tests, all-target clippy and structural budgets, then isolated its "
              "sole project-fast failure to the intentionally stale A11 seal; the remaining "
              "fast checks passed and the working tree was clean. This docs-only reseal "
              "records those retained exact-SHA results without changing A9 or B4, which "
              "remain OPEN under their unchanged criteria."
          )
          path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + "\n")
          PY
          python3 scripts/render-capability-status.py
          python3 scripts/render-capability-status.py --check

      - name: Verify the deterministic fast project gate
        shell: bash
        run: |
          set -euo pipefail
          brew install shellcheck
          python3 -m pip install --break-system-packages --quiet pyyaml
          scripts/check-project.sh --fast

      - name: Remove the one-shot workflow and commit generated blocks
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/a11-reseal-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: reseal A11 after deterministic fuzz fix"
          git push origin HEAD:fix/a11-reseal-810b2ac
