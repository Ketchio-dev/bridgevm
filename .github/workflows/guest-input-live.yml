name: Installed guest input live asset contracts
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/live-gates/guest_input_*', 'tests/integration/guest-input-live-*', 'tests/integration/guest_input_*', '.github/workflows/guest-input-live.yml']}}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python tests/integration/guest-input-live-inputs-test.py && python tests/integration/guest-input-live-cleanup-test.py
