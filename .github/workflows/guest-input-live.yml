name: Installed guest input live asset contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tests/integration/guest-input-live-inputs-test.py && python tests/integration/guest-input-live-cleanup-test.py
