name: WinPE no-3D diagnostic contracts
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/live-gates/run-winpe-companions.py', 'scripts/live-gates/winpe_companion_*', 'tests/integration/winpe-companion-diagnostic-test.py', 'tests/integration/winpe_companion_*', '.github/workflows/winpe-companion-diagnostic.yml']}}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 tests/integration/winpe-companion-diagnostic-test.py
