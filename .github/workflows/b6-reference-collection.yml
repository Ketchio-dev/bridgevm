name: B6 reference collection contract
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/b6-collect-reference-inventory.sh', 'scripts/b6-pre-readiness-inventory.sh', 'tests/integration/b6-pre-readiness-inventory-contract.py', 'tests/integration/b6-reference-collection-contract.py', '.github/workflows/b6-reference-collection.yml']}, workflow_dispatch: {}}
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require acknowledged bounded observation-only collection
        run: python3 tests/integration/b6-reference-collection-contract.py && python3 tests/integration/b6-pre-readiness-inventory-contract.py
