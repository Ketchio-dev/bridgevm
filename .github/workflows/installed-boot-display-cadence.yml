name: Installed-boot display cadence contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  display-cadence:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The 3D-off ramfb export period is its own bounded wrapper flag
        run: bash tests/integration/hvf-windows-installed-boot-ramfb-display-cadence-smoke.sh
