name: Installed-boot display cadence contract
on: {push: {}, pull_request: {paths: ['crates/bridgevm-hvf/examples/hvf_gic_boot_probe/probe_runtime/vtimer_recovery.rs', 'scripts/check-hvf-windows-p3-gpu-readiness.sh', 'scripts/harvest-hvf-windows-postmortem.sh', 'scripts/hvf-terminal-report.sh', 'scripts/run-hvf-windows-installed-boot*', 'scripts/win-assets/bv-ppsspp-title.json', 'tests/integration/hvf-windows-installed-boot-p3-gpu-policy-smoke.sh', 'tests/integration/hvf-windows-installed-boot-ramfb-display-cadence-smoke.sh', '.github/workflows/installed-boot-display-cadence.yml']}}
permissions:
  contents: read
jobs:
  display-cadence:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The 3D-off ramfb export period and the P3 GPU policy hold in the installed-boot wrapper
        run: bash tests/integration/hvf-windows-installed-boot-ramfb-display-cadence-smoke.sh && bash tests/integration/hvf-windows-installed-boot-p3-gpu-policy-smoke.sh
