name: Packaged control resource contracts
on:
  push: {branches: [main]}
  pull_request: {paths: ['apps/macos/Sources/BridgeVMControl/BridgeVMControlResources.swift', 'apps/macos/Sources/BridgeVMControl/HvfEngine/HvfSecureBootProvisioner.swift', 'apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsBootSeed.swift', 'apps/macos/Sources/BridgeVMControl/Resources/**', 'crates/bridgevm-hvf/firmware/edk2-aarch64-secure-code.fd*', 'tests/integration/HvfSecureBootProvisioningSmoke.swift', 'tests/integration/PackagedControlResourcesSmoke.swift', 'tests/integration/compile-control-resources-smoke.sh', 'tests/integration/hvf-secure-boot-provisioning-smoke.sh', 'tests/integration/packaged-control-resources-smoke.sh', '.github/workflows/packaged-control-resources.yml']}
permissions:
  contents: read
jobs:
  relocated-resources:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Real resource callers in relocated owned app layouts (no app lifecycle or guest)
        run: bash tests/integration/packaged-control-resources-smoke.sh
      - name: Existing Secure Boot policy and provisioning contracts
        run: bash tests/integration/hvf-secure-boot-provisioning-smoke.sh
