name: One-shot virtio-net avail bound fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'takeover/virtio-net-avail-bound'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply and verify bounded net TX avail processing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("crates/bridgevm-hvf/src/virtio_net")
          module = root / "mod.rs"
          datapath = root / "datapath.rs"
          pending = root / "queue_pending.rs"
          tests_module = root / "tests/mod.rs"
          pending_tests = root / "tests/queue_pending.rs"

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              module,
              "mod protocol;\n",
              "mod protocol;\nmod queue_pending;\n",
              "net queue_pending module",
          )
          replace_once(
              tests_module,
              "mod helpers;\n",
              "mod helpers;\nmod queue_pending;\n",
              "net queue_pending tests",
          )
          replace_once(
              datapath,
              "use super::*;\n",
              "use super::queue_pending::pending_entries;\nuse super::*;\n",
              "net pending helper import",
          )
          replace_once(
              datapath,
              "        while self.queues[queue_index].last_avail_idx != avail_idx {\n",
              "        for _ in 0..pending_entries(queue.last_avail_idx, avail_idx, queue.size) {\n",
              "net TX avail loop",
          )

          pending.write_text(
              """//! Caps one virtio-net TX notification at the active queue capacity.

          pub(super) fn pending_entries(last_avail_idx: u16, avail_idx: u16, queue_size: u16) -> u16 {
              avail_idx.wrapping_sub(last_avail_idx).min(queue_size)
          }
          """
          )
          pending_tests.write_text(
              """use super::super::*;
          use super::helpers::*;

          #[test]
          fn net_tx_queue_caps_malformed_avail_delta_at_queue_size() {
              let mut dev = VirtioPciNet::new_loopback();
              let mut mem = TestMem::new(0x4000_0000, 0x10000);
              let desc = 0x4000_1000;
              let avail = 0x4000_2000;
              let used = 0x4000_3000;
              let queue_size = 8u16;

              setup_queue(
                  &mut dev,
                  &mut mem,
                  QUEUE_TX as u16,
                  desc,
                  avail,
                  used,
                  1,
              );
              mem.write(avail + 2, &queue_size.wrapping_add(1).to_le_bytes());

              pci_write(&mut dev, PCI_NOTIFY_CFG_OFFSET + 4, 4, 0, &mut mem);

              assert_eq!(dev.stats().queues[QUEUE_TX].last_avail_idx, queue_size);
              assert_eq!(
                  u16::from_le_bytes(mem.read(used + 2, 2).try_into().unwrap()),
                  queue_size
              );
              assert_eq!(dev.stats().notify_count, 1);
          }
          """
          )
          PY

          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          import re

          budget = Path("scripts/refactor-budgets.tsv")
          targets = [
              (
                  "crates/bridgevm-hvf/src/virtio_net/queue_pending.rs",
                  "crates/bridgevm-hvf/src/virtio_net/protocol.rs",
              ),
              (
                  "crates/bridgevm-hvf/src/virtio_net/tests/queue_pending.rs",
                  "crates/bridgevm-hvf/src/virtio_net/tests/part_1.rs",
              ),
          ]
          declaration = re.compile(
              r"^\s*((pub\s+)?(mod|use)\s+[^;{]*;|#\[path\s*=.*\])\s*$"
          )

          def measured_loc(path: Path) -> int:
              loc = 0
              header = True
              for line in path.read_text().splitlines():
                  if header and line.lstrip().startswith("//!"):
                      continue
                  if header and not line.strip():
                      header = False
                      continue
                  header = False
                  if declaration.match(line):
                      continue
                  loc += 1
              return loc

          lines = budget.read_text().splitlines()
          for target, anchor in targets:
              if any(line.split("\t", 1)[0] == target for line in lines):
                  raise SystemExit(f"budget already contains {target}")
              index = next(
                  (i for i, line in enumerate(lines) if line.split("\t", 1)[0] == anchor),
                  None,
              )
              if index is None:
                  raise SystemExit(f"budget anchor missing: {anchor}")
              lines.insert(index + 1, f"{target}\t{measured_loc(Path(target))}\t0")
          budget.write_text("\n".join(lines) + "\n")
          PY

          rm -f .github/workflows/takeover-virtio-net-avail-bound.yml
          cargo test -p bridgevm-hvf --locked \
            net_tx_queue_caps_malformed_avail_delta_at_queue_size
          cargo check -p bridgevm-hvf --locked
          scripts/check-refactor-budgets.sh
          git diff --check

          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "net: bound TX avail processing by queue size [net-avail-bound-complete]" \
            -m "Limit each virtio-net TX notification to the active queue capacity so a corrupt or hostile avail index cannot amplify one doorbell into a 65,535-iteration host loop."
          git push origin HEAD:takeover/virtio-net-avail-bound