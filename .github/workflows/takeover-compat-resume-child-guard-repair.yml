name: Repair compatibility resume child guard generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'takeover/compat-resume-child-guard'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Repair quoting and run the one-shot source generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/takeover-compat-resume-child-guard.yml')
          lines = workflow.read_text().splitlines()
          marker = '        run: |'
          try:
              start = lines.index(marker) + 1
          except ValueError as error:
              raise SystemExit('source workflow run block missing') from error

          script_lines = []
          for line in lines[start:]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line:
                  script_lines.append('')
              else:
                  break
          script = '\n'.join(script_lines) + '\n'

          old = r'.arg("sleep 0.2; : > \"$1\"")'
          new = r'.arg(r#"sleep 0.2; : > "$1""#)'
          if script.count(old) != 1:
              raise SystemExit(f'quoted test command anchor changed: {script.count(old)}')
          script = script.replace(old, new, 1)

          cleanup = 'rm -f .github/workflows/takeover-compat-resume-child-guard.yml'
          replacement = (
              cleanup
              + ' .github/workflows/takeover-compat-resume-child-guard-repair.yml'
          )
          if script.count(cleanup) != 1:
              raise SystemExit('workflow cleanup anchor changed')
          script = script.replace(cleanup, replacement, 1)

          output = Path('/tmp/bridgevm-compat-resume-generator.sh')
          output.write_text(script)
          output.chmod(0o700)
          PY
          /tmp/bridgevm-compat-resume-generator.sh
