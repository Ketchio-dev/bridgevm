name: One-shot audio verifier finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'takeover/audio-verifier-fail-closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install deterministic gate dependencies
        run: |
          python3 -m pip install --quiet pyyaml
          command -v shellcheck
      - name: Reseal budgets and verify through the permanent Python gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          declaration = re.compile(
              r'^\s*(?:(?:pub\s+)?(?:mod|use)\s+[^;{]*;|#\[path\s*=\s*[^]]*\])\s*$'
          )

          def structural_loc(path: str) -> int:
              header = True
              loc = 0
              for line in Path(path).read_text().splitlines():
                  if header and re.match(r'^\s*//!', line):
                      continue
                  if header and re.match(r'^\s*$', line):
                      header = False
                      continue
                  header = False
                  if declaration.match(line):
                      continue
                  loc += 1
              return loc

          budgets_path = Path('scripts/refactor-budgets.tsv')
          budgets = budgets_path.read_text()
          for path in [
              'scripts/check-project.sh',
              'scripts/check-python-scripts.py',
              'scripts/verify-audio-playback.sh',
          ]:
              pattern = re.compile(rf'^{re.escape(path)}\t(\d+)\t0$', re.MULTILINE)
              match = pattern.search(budgets)
              if match is None:
                  raise SystemExit(f'budget row missing: {path}')
              old_ceiling = int(match.group(1))
              loc = structural_loc(path)
              if loc > old_ceiling:
                  raise SystemExit(f'{path} grew from ceiling {old_ceiling} to {loc}')
              budgets = pattern.sub(f'{path}\t{loc}\t0', budgets, count=1)
              print(f'resealed {path}: {old_ceiling} -> {loc}')

          new_path = 'scripts/audio-playback-result.py'
          if re.search(rf'^{re.escape(new_path)}\t', budgets, re.MULTILINE):
              raise SystemExit('audio classifier budget row already exists')
          new_loc = structural_loc(new_path)
          anchor = 'scripts/build-guest-agent-linux.sh\t56\t0\n'
          if budgets.count(anchor) != 1:
              raise SystemExit('script budget insertion anchor changed')
          budgets = budgets.replace(anchor, f'{new_path}\t{new_loc}\t0\n' + anchor, 1)
          budgets_path.write_text(budgets)
          print(f'registered {new_path}: {new_loc}')
          PY

          for attempt in $(seq 1 20); do
            echo "audio result classifier self-test ${attempt}/20"
            python3 scripts/audio-playback-result.py --self-test
          done
          bash -n scripts/verify-audio-playback.sh
          BRIDGEVM_REQUIRE_SHELLCHECK=1 bash scripts/check-shell-scripts.sh
          python3 scripts/check-python-scripts.py
          python3 scripts/check-workflow-yaml.py
          scripts/check-refactor-budgets.sh
          git diff --check

          rm -f .github/workflows/takeover-audio-verifier-finalize.yml
          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "fix: fail closed on invalid audio playback results [audio-verifier-complete]" \
            -m "Require a clean launcher exit, positive rendered frames, zero drops, and zero CoreAudio callback errors. Reject missing, malformed, duplicate, and negative counters through a hosted self-tested classifier, invoke that classifier from the Python gate already required by CI, and reseal structural budgets at measured sizes. Closes #122."
          git push origin HEAD:takeover/audio-verifier-fail-closed
