name: One-shot owned cleanup transaction verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'takeover/owned-cleanup-transaction'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Seal and verify owned cleanup persistence
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 - <<'PY'
          import re
          from pathlib import Path

          budget = Path("scripts/refactor-budgets.tsv")
          lifecycle = "crates/bridgevm-daemon/src/backend_lifecycle.rs"
          cleanup = "crates/bridgevm-daemon/src/backend_lifecycle/cleanup.rs"
          test = "crates/bridgevm-daemon/src/tests_split/owned_cleanup.rs"
          test_anchor = "crates/bridgevm-daemon/src/tests_split/helpers.rs"

          def measured_loc(path: Path) -> int:
              loc = 0
              header = True
              for line in path.read_text().splitlines():
                  if header and re.match(r"^\s*//!", line):
                      continue
                  if header and re.match(r"^\s*$", line):
                      header = False
                      continue
                  header = False
                  if re.match(
                      r"^\s*((pub\s+)?(mod|use)\s+[^;{]*;|#\[path\s*=\s*[^]]*\])\s*$",
                      line,
                  ):
                      continue
                  loc += 1
              return loc

          lines = budget.read_text().splitlines()
          paths = [line.split("\t", 1)[0] for line in lines if line and not line.startswith("#")]
          for target in (cleanup, test):
              if target in paths:
                  raise SystemExit(f"budget already contains {target}")

          lifecycle_index = next(
              (i for i, line in enumerate(lines) if line.split("\t", 1)[0] == lifecycle),
              None,
          )
          if lifecycle_index is None:
              raise SystemExit("backend lifecycle budget anchor missing")
          parts = lines[lifecycle_index].split("\t")
          actual = measured_loc(Path(lifecycle))
          if actual > int(parts[1]):
              raise SystemExit(f"{lifecycle} grew {parts[1]}->{actual}")
          parts[1] = str(actual)
          lines[lifecycle_index] = "\t".join(parts)
          lines.insert(lifecycle_index + 1, f"{cleanup}\t{measured_loc(Path(cleanup))}\t0")

          test_index = next(
              (i for i, line in enumerate(lines) if line.split("\t", 1)[0] == test_anchor),
              None,
          )
          if test_index is None:
              raise SystemExit("daemon test budget anchor missing")
          lines.insert(test_index + 1, f"{test}\t{measured_loc(Path(test))}\t0")
          budget.write_text("\n".join(lines) + "\n")
          PY

          rm -f .github/workflows/takeover-owned-cleanup.yml
          cargo test -p bridgevm-daemon --locked \
            owned_cleanup_retries
          cargo check -p bridgevm-daemon --locked
          scripts/check-refactor-budgets.sh
          git diff --check

          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "daemon: make owned cleanup persistence retryable [owned-cleanup-complete]" \
            -m "Keep terminated child entries under daemon ownership until Stopped state and runner-metadata cleanup both persist, skipping QMP on retries for an already-exited child."
          git push origin HEAD:takeover/owned-cleanup-transaction
