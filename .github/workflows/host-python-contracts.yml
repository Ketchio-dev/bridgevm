name: Host Python contracts
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/doc_code_identity.py', 'scripts/vmctl.py', 'scripts/vmctl_frame.py', 'tests/integration/vmctl-test.py', 'tests/integration/doc-code-identity-contract.py', '.github/workflows/host-python-contracts.yml']}}
permissions:
  contents: read
jobs:
  contract:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typed-hashes
            command: python3 tests/integration/doc-code-identity-contract.py
          - check: vm-control
            command: python3 tests/integration/vmctl-test.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: ${{ matrix.command }}
