name: One-shot Fast resume isolation verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'takeover/fast-resume-opt-in-guard'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Format, reseal budgets, and verify isolated restore tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          import re

          declaration = re.compile(
              r'^\s*(?:(?:pub\s+)?(?:mod|use)\s+[^;{]*;|#\[path\s*=\s*[^]]*\])\s*$'
          )

          def structural_loc(path: str) -> int:
              header = True
              loc = 0
              for line in Path(path).read_text().splitlines():
                  if header and re.match(r'^\s*//!', line):
                      continue
                  if header and re.match(r'^\s*$', line):
                      header = False
                      continue
                  header = False
                  if declaration.match(line):
                      continue
                  loc += 1
              return loc

          budgets_path = Path('scripts/refactor-budgets.tsv')
          budgets = budgets_path.read_text()
          paths = [
              'crates/bridgevm-daemon/src/backend_lifecycle.rs',
              'crates/bridgevm-daemon/src/tests_split/fast_resume_opt_in.rs',
          ]
          for path in paths:
              pattern = re.compile(rf'^{re.escape(path)}\t(\d+)\t0$', re.MULTILINE)
              match = pattern.search(budgets)
              if match is None:
                  raise SystemExit(f'budget row missing: {path}')
              old_ceiling = int(match.group(1))
              loc = structural_loc(path)
              if loc > old_ceiling:
                  raise SystemExit(f'{path} grew from ceiling {old_ceiling} to {loc}')
              budgets = pattern.sub(f'{path}\t{loc}\t0', budgets, count=1)
              print(f'resealed {path}: {old_ceiling} -> {loc}')
          budgets_path.write_text(budgets)
          PY

          for attempt in $(seq 1 10); do
            echo "focused Fast resume regressions attempt ${attempt}/10"
            cargo test -p bridgevm-daemon --locked fast_resume_opt_in
          done
          for attempt in $(seq 1 5); do
            echo "full daemon isolation run ${attempt}/5"
            cargo test -p bridgevm-daemon --locked
          done
          cargo clippy -p bridgevm-daemon --all-targets --locked -- -D warnings
          scripts/check-refactor-budgets.sh
          git diff --check

          rm -f .github/workflows/takeover-fast-resume-isolation.yml
          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "test: isolate Fast restore verification from global env [fast-resume-isolation-complete]" \
            -m "Keep the opt-in refusal regression against the public daemon resume path, but validate the enabled restore spawn through an explicit configuration so parallel dry-run tests cannot observe a transient global launch opt-in. Prove the focused tests ten times and the full daemon suite five times before pushing the formatted, resealed tree."
          git push origin HEAD:takeover/fast-resume-opt-in-guard
