name: T17 guest challenge contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-challenge:
    name: T17 input challenge parses and binds under Windows PowerShell
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse the guest challenge and build its bindings and form
        shell: powershell
        run: scripts/test-bv-product-e2e-challenge.ps1
