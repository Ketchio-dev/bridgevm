name: Guest application input sink contracts
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/test-bvagent-input-sink.ps1', 'scripts/win-assets/bv-input-order-sink.ps1', '.github/workflows/guest-input-sink.yml']}}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: scripts/test-bvagent-input-sink.ps1
      - shell: pwsh
        run: scripts/test-bvagent-input-sink.ps1
