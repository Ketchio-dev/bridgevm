name: D11 development fixture contracts
on:
  push: {branches: [main]}
  pull_request: {paths: ['apps/macos/Sources/BridgeVMControl/BridgeVMControlResources.swift', 'apps/macos/Sources/BridgeVMControl/HvfEngine/HvfSecureBootProvisioner.swift', 'apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsBootSeed.swift', 'apps/macos/Sources/BridgeVMProductE2E/T17PrivateUnattend.swift', 'crates/bridgevm-hvf/firmware/edk2-aarch64-secure-code.fd', 'scripts/*.py', 'scripts/check-d11-fixture.sh', 'scripts/development/D11FixtureHelper.swift', 'scripts/live-gates/**', 'scripts/win-assets/bv-d11-fixture-ready.ps1', 'scripts/win-assets/unattend.xml', 'tests/integration/d11*', '.github/workflows/d11-fixture-contract.yml']}
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-d11-fixture.sh
  guest-script:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: powershell
        run: tests/integration/d11-fixture-powershell-contract.ps1
      - shell: pwsh
        run: tests/integration/d11-fixture-powershell-contract.ps1
