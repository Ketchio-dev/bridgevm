name: Guest agent print-to-Mac contract
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/win-assets/bvagent.ps1', 'tests/integration/agent-print-contract.ps1', '.github/workflows/agent-print-contract.yml']}}
permissions:
  contents: read
jobs:
  print:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: PRINTWATCH setup, job detection and PRINTJOB dispatch (Windows PowerShell 5.1)
        shell: powershell
        run: tests/integration/agent-print-contract.ps1
      - name: The same, C# 5 checked (PowerShell 7)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: tests/integration/agent-print-contract.ps1
