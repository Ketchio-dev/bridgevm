name: One-shot virtio-blk avail bound fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'takeover/virtio-blk-avail-bound'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply and verify bounded avail processing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("crates/bridgevm-hvf/src/virtio_blk")
          module = root / "mod.rs"
          queue = root / "virtqueue.rs"
          pending = root / "queue_pending.rs"

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              module,
              "mod protocol;\n",
              "mod protocol;\nmod queue_pending;\n",
              "queue_pending module",
          )
          replace_once(
              queue,
              "use crate::fwcfg::GuestMemoryMut;\n",
              "use crate::fwcfg::GuestMemoryMut;\nuse super::queue_pending::pending_entries;\n",
              "pending helper import",
          )
          replace_once(
              queue,
              "        while self.last_avail_idx != avail_idx {\n",
              "        for _ in 0..pending_entries(self.last_avail_idx, avail_idx, self.queue_num) {\n",
              "avail loop",
          )
          pending.write_text(
              """//! Bounds one notification's avail-ring work to the configured queue size.

          pub(super) fn pending_entries(
              last_avail_idx: u16,
              avail_idx: u16,
              queue_num: u16,
          ) -> u16 {
              avail_idx.wrapping_sub(last_avail_idx).min(queue_num)
          }

          #[cfg(test)]
          mod tests {
              use super::super::tests::{temp_path, TestMem};
              use super::super::{read_u16, VirtioMmioBlock, SECTOR_SIZE};
              use std::fs;

              #[test]
              fn process_queue_caps_malformed_avail_delta_at_queue_size() {
                  let path = temp_path("avail-bound");
                  fs::write(&path, vec![0u8; SECTOR_SIZE as usize]).unwrap();
                  let mut dev = VirtioMmioBlock::open_read_only_modern(&path).unwrap();
                  let mut mem = TestMem::new(0x4000_0000, 0x10000);
                  let desc = 0x4000_1000;
                  let avail = 0x4000_2000;
                  let used = 0x4000_3000;
                  let queue_num = 8u16;

                  dev.queue_num = queue_num;
                  dev.queue_desc = desc;
                  dev.queue_driver = avail;
                  dev.queue_device = used;
                  dev.queue_ready = true;
                  mem.write(avail + 2, &queue_num.wrapping_add(1).to_le_bytes());

                  dev.process_queue(&mut mem);

                  assert_eq!(dev.last_avail_idx, queue_num);
                  assert_eq!(read_u16(&mem, used + 2), Some(queue_num));
                  fs::remove_file(path).ok();
              }
          }
          """
          )
          PY

          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path

          target = "crates/bridgevm-hvf/src/virtio_blk/queue_pending.rs"
          budget = Path("scripts/refactor-budgets.tsv")
          lines = budget.read_text().splitlines()
          if any(line.split("\t", 1)[0] == target for line in lines):
              raise SystemExit(f"budget already contains {target}")
          anchor = "crates/bridgevm-hvf/src/virtio_blk/protocol.rs"
          index = next(
              (i for i, line in enumerate(lines) if line.split("\t", 1)[0] == anchor),
              None,
          )
          if index is None:
              raise SystemExit("virtio-blk protocol budget anchor missing")
          lines.insert(index + 1, f"{target}\t34\t0")
          budget.write_text("\n".join(lines) + "\n")
          PY

          rm -f .github/workflows/takeover-virtio-blk-avail-bound.yml
          cargo test -p bridgevm-hvf --locked \
            process_queue_caps_malformed_avail_delta_at_queue_size
          cargo check -p bridgevm-hvf --locked
          scripts/check-refactor-budgets.sh
          git diff --check

          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "block: bound avail processing by queue size [blk-avail-bound-complete]" \
            -m "Limit one virtio-blk notification to at most queue_num entries so a corrupt or hostile avail index cannot amplify a single kick into a 65,535-iteration host loop."
          git push origin HEAD:takeover/virtio-blk-avail-bound