name: Agent channel acknowledgment contract
on: {push: {}, pull_request: {paths: ['scripts/agent-channel-lib.sh', 'scripts/snapshot-restore-*', 'scripts/verify-snapshot-restore-boots.sh', 'scripts/live-gates/bridgevm-live', 'scripts/live-gates/snapshot_restore_inputs.py', 'scripts/live-gates/live-process-cleanup.sh', 'tests/integration/agent-channel-acknowledgment-contract.py', 'tests/integration/firstboot-launcher-liveness-contract.py', 'tests/integration/snapshot-restore-*', '.github/workflows/agent-channel-acknowledgment.yml']}, workflow_dispatch: {}}
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require a fresh successful command and END acknowledgment
        run: python3 tests/integration/agent-channel-acknowledgment-contract.py && python3 tests/integration/firstboot-launcher-liveness-contract.py && python3 tests/integration/snapshot-restore-channel-contract.py && python3 tests/integration/snapshot-restore-seal-contract.py && python3 tests/integration/snapshot-restore-cleanup-contract.py && python3 tests/integration/snapshot-restore-clone-permissions-contract.py && bash tests/integration/snapshot-restore-relocation-contract.sh
