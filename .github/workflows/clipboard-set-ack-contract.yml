name: Clipboard set acknowledgment contract
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/win-assets/bvagent.ps1', 'tests/integration/clipboard-set-ack-contract.ps1', '.github/workflows/clipboard-set-ack-contract.yml']}}
permissions:
  contents: read
jobs:
  clipboard-set:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Exercise the guest CLIPSET implementation
        shell: powershell
        run: tests/integration/clipboard-set-ack-contract.ps1
