name: Snapshot evidence contracts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.0
      - name: Selected generation retention and strict snapshot evidence
        run: |
          python3 tests/integration/t17-selected-retention-contract.py && python3 tests/integration/t17-selected-retention-mutation-contract.py
          python3 tests/integration/native-snapshot-export-json-contract.py && python3 tests/integration/retained-windows-publication-contract.py && python3 tests/integration/retained-windows-cleanup-races-contract.py
          python3 tests/integration/a19-lifecycle-campaign-progress-contract.py
