name: Snapshot evidence contracts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.0
      - name: Selected generation retention and strict snapshot evidence
        run: scripts/check-snapshot-evidence-contracts.sh
