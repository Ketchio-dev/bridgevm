name: WinPE agent companion delivery contracts
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/test-bvagent-injector-delivery.ps1', 'scripts/win-assets/bvinject.cmd', '.github/workflows/injector-input-delivery.yml']}}
permissions:
  contents: read
jobs:
  delivery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Exercise production copy block with Windows PowerShell 5.1
        shell: powershell
        run: scripts/test-bvagent-injector-delivery.ps1
      - name: Exercise production copy block with PowerShell 7
        shell: pwsh
        run: scripts/test-bvagent-injector-delivery.ps1
