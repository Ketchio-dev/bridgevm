name: WinPE driver metadata contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/integration/injector-driver-metadata-test.py && python3 tests/integration/injector-driver-fat-test.py
