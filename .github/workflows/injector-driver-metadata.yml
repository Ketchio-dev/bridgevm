name: WinPE driver metadata contracts
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/build-hvf-windows-driver-injector.sh', 'scripts/stage-injector-boot-alias.sh', 'tests/integration/injector-boot-alias-test.py', 'tests/integration/injector-driver-*', '.github/workflows/injector-driver-metadata.yml']}}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 tests/integration/injector-driver-metadata-test.py && python3 tests/integration/injector-driver-fat-test.py && python3 tests/integration/injector-boot-alias-test.py
