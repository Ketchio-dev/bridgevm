name: One-shot guest benchmark handshake stabilization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'takeover/guest-benchmark-handshake-wait'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Extract and stabilize the guest benchmark regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          part = Path("crates/bridgevm-daemon/src/tests_split/part_3.rs")
          module = Path("crates/bridgevm-daemon/src/tests_split/mod.rs")
          target = Path("crates/bridgevm-daemon/src/tests_split/performance_guest_benchmark.rs")
          text = part.read_text()
          start_anchor = "#[test]\nfn daemon_performance_sample_runs_guest_benchmark_when_session_is_connected() {"
          start = text.find(start_anchor)
          if start < 0:
              raise SystemExit("guest benchmark test start anchor missing")
          end = text.find("\n#[test]\n", start + len(start_anchor))
          if end < 0:
              raise SystemExit("guest benchmark test end anchor missing")
          block = text[start:end]

          output_anchor = '    let output = store.root().join("daemon-performance-with-benchmark");\n'
          wait_lines = [
              "    assert!(",
              "        wait_up_to_ten_seconds(|| {",
              "            if state",
              "                .children",
              "                .get(\"legacy\")",
              "                .is_some_and(|backend| backend.guest_tools.is_some())",
              "            {",
              "                return true;",
              "            }",
              "            state.reconcile_children().unwrap();",
              "            state",
              "                .children",
              "                .get(\"legacy\")",
              "                .is_some_and(|backend| backend.guest_tools.is_some())",
              "        }),",
              "        \"guest-tools handshake did not complete before performance sampling\"",
              "    );",
              "",
          ]
          wait = "\n".join(wait_lines) + "\n"
          if block.count(output_anchor) != 1:
              raise SystemExit(f"guest benchmark output anchor changed: {block.count(output_anchor)}")
          block = block.replace(output_anchor, wait + output_anchor, 1)

          import_lines = [
              "//! Guest benchmark sampling waits for the asynchronous tools handshake.",
              "",
              "use super::helpers::*;",
              "use super::wait::wait_up_to_ten_seconds;",
              "use crate::*;",
              "use bridgevm_agent_protocol::AgentAuth;",
              "use bridgevm_agent_protocol::AgentCapability;",
              "use bridgevm_agent_protocol::AgentEnvelope;",
              "use bridgevm_agent_protocol::AgentMessage;",
              "use bridgevm_agent_protocol::DEFAULT_BENCHMARK_DURATION_MILLIS;",
              "use bridgevm_agent_protocol::PROTOCOL_VERSION;",
              "use bridgevm_agentd::encode_envelope_line;",
              "use bridgevm_api::BridgeVmRequest;",
              "use bridgevm_api::BridgeVmResponse;",
              "use bridgevm_storage::VmRuntimeState;",
              "use std::fs;",
              "use std::io::BufRead;",
              "use std::io::BufReader;",
              "use std::io::Write;",
              "use std::os::unix::net::UnixListener;",
              "use std::process::Command;",
              "use std::thread;",
              "use std::time::Duration;",
              "",
          ]
          target.write_text("\n".join(import_lines) + block + "\n")
          part.write_text(text[:start] + text[end + 1:])

          module_text = module.read_text()
          module_anchor = "mod part_1;\n"
          if module_text.count(module_anchor) != 1:
              raise SystemExit("daemon test module anchor changed")
          module.write_text(
              module_text.replace(
                  module_anchor,
                  "mod part_1;\nmod performance_guest_benchmark;\n",
                  1,
              )
          )
          PY

          cargo fmt --all
          python3 - <<'PY'
          import re
          from pathlib import Path

          budget = Path("scripts/refactor-budgets.tsv")
          part = "crates/bridgevm-daemon/src/tests_split/part_3.rs"
          target = "crates/bridgevm-daemon/src/tests_split/performance_guest_benchmark.rs"

          def measured_loc(path: Path) -> int:
              loc = 0
              header = True
              for line in path.read_text().splitlines():
                  if header and re.match(r"^\s*//!", line):
                      continue
                  if header and re.match(r"^\s*$", line):
                      header = False
                      continue
                  header = False
                  if re.match(
                      r"^\s*((pub\s+)?(mod|use)\s+[^;{]*;|#\[path\s*=\s*[^]]*\])\s*$",
                      line,
                  ):
                      continue
                  loc += 1
              return loc

          lines = budget.read_text().splitlines()
          if any(line.split("\t", 1)[0] == target for line in lines):
              raise SystemExit(f"budget already contains {target}")
          index = next(
              (i for i, line in enumerate(lines) if line.split("\t", 1)[0] == part),
              None,
          )
          if index is None:
              raise SystemExit("part_3 budget anchor missing")
          parts = lines[index].split("\t")
          actual = measured_loc(Path(part))
          if actual > int(parts[1]):
              raise SystemExit(f"{part} grew {parts[1]}->{actual}")
          parts[1] = str(actual)
          lines[index] = "\t".join(parts)
          lines.insert(index + 1, f"{target}\t{measured_loc(Path(target))}\t0")
          budget.write_text("\n".join(lines) + "\n")
          PY

          rm -f .github/workflows/takeover-guest-benchmark-handshake.yml
          for attempt in $(seq 1 10); do
            echo "guest benchmark handshake regression attempt ${attempt}/10"
            cargo test -p bridgevm-daemon --locked \
              daemon_performance_sample_runs_guest_benchmark_when_session_is_connected
          done
          cargo check -p bridgevm-daemon --locked
          scripts/check-refactor-budgets.sh
          git diff --check

          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "test: wait for guest benchmark handshake [guest-benchmark-handshake-complete]" \
            -m "Drive bounded reconcile ticks until the asynchronous guest-tools hello has established a session before requesting a performance sample, and extract the regression into its own budgeted test module."
          git push origin HEAD:takeover/guest-benchmark-handshake-wait
