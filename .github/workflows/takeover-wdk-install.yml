name: One-shot Windows UMD WDK setup fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'takeover/b4-umd-resource-list'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Patch the Windows UMD workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_windows_umd_wdk.py
          python3 -m pip install --break-system-packages --quiet pyyaml
          python3 scripts/check-workflow-yaml.py
          git diff --check

          rm -f \
            .github/workflows/takeover-wdk-install.yml \
            .github/scripts/patch_windows_umd_wdk.py
          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "ci: install the official SDK and WDK for the ARM64 UMD build" \
            -m "GitHub's Windows image carries the shared D3D kernel header but not d3d10umddi.h. Install the matching Microsoft Windows SDK and WDK before cross-building the pinned Mesa UMD."
          git push origin HEAD:takeover/b4-umd-resource-list
