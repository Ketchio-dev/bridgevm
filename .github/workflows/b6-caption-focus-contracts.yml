name: B6 caption focus contracts
on:
  push: {branches: [main]}
  pull_request: {paths: ['.github/actions/b6-tip-contracts/**', 'scripts/b6-caption-focus.sh', 'scripts/b6-tip-dismiss.sh', 'scripts/win-assets/bv-b6-caption-point.ps1', 'scripts/win-assets/bv-b6-tip-point.ps1', 'tests/integration/b6-caption-*', 'tests/integration/b6-tip-*', '.github/workflows/b6-caption-focus-contracts.yml']}
permissions:
  contents: read
jobs:
  host-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tests/integration/b6-caption-focus-contract.py && python3 tests/integration/b6-tip-dismiss-contract.py
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/b6-tip-contracts
        with:
          mode: caption
