name: B6 active frame-time contracts
on:
  push:
    branches: [main]
  pull_request: {paths: ['scripts/b6-active-frame-time.sh', 'scripts/b6_presentmon_evidence.py', 'tests/integration/b6-active-frame-time-contract.py', '.github/workflows/b6-active-frame-time-contracts.yml']}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Authenticate active-scene collection contracts
        run: python3 tests/integration/b6-active-frame-time-contract.py
