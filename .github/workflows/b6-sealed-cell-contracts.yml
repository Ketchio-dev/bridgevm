name: B6 sealed cell contracts
on:
  push:
    branches: [main]
  pull_request: {paths: ['scripts/live-gates/b6_*', 'scripts/live-gates/bridgevm-live', 'scripts/live-gates/run-b6-cell-observation.py', 'tests/integration/b6-cell-observation-contract.py', '.github/workflows/b6-sealed-cell-contracts.yml']}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exercise sealed input and clone refusal contracts
        run: python3 tests/integration/b6-cell-observation-contract.py
