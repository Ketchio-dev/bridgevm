name: B6 sealed cell contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exercise sealed input and clone refusal contracts
        run: python3 tests/integration/b6-cell-observation-contract.py
