name: One-shot A9 fail-closed port

on:
  push:
    branches: [takeover/a9-fail-closed]

permissions:
  contents: write

jobs:
  port:
    if: ${{ !contains(github.event.head_commit.message, '[a9-port-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Port only the proven product fail-closed surface
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=28b0110e9496b7015c83ae485afb77ab86b90174
          git fetch --no-tags origin agent/known-problems-integration
          paths=(
            apps/macos/Sources/BridgeVMControl/CreateVM.swift
            apps/macos/Sources/BridgeVMControl/HvfEngine/HvfEngineConfig.swift
            apps/macos/Sources/BridgeVMControl/HvfEngine/HvfEngineSession.swift
            apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsDriverPreflight.swift
            apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsInstall.swift
            apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsInstallView.swift
            apps/macos/Tests/BridgeVMControlTests/HvfWindowsDriverPreflightTests.swift
            apps/macos/Tests/BridgeVMControlTests/HvfWindowsInstallTests.swift
            apps/macos/Tests/BridgeVMControlTests/HvfWindowsProductInjectionPreflightTests.swift
            apps/macos/Tests/BridgeVMControlTests/HvfWindowsStaleInjectionMarkerTests.swift
            tests/integration/hvf-windows-product-injection-deny-smoke.sh
          )
          git checkout "$SOURCE" -- "${paths[@]}"
          chmod +x tests/integration/hvf-windows-product-injection-deny-smoke.sh

          python3 - <<'PY'
          from pathlib import Path

          budget_path = Path("scripts/refactor-budgets.tsv")
          lines = budget_path.read_text().splitlines()
          updates = {
              "apps/macos/Sources/BridgeVMControl/CreateVM.swift": 910,
              "apps/macos/Sources/BridgeVMControl/HvfEngine/HvfEngineConfig.swift": 358,
              "apps/macos/Sources/BridgeVMControl/HvfEngine/HvfEngineSession.swift": 572,
              "apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsInstall.swift": 492,
              "apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsInstallView.swift": 141,
              "apps/macos/Tests/BridgeVMControlTests/HvfWindowsInstallTests.swift": 333,
          }
          new_rows = {
              "apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsDriverPreflight.swift": 45,
              "apps/macos/Tests/BridgeVMControlTests/HvfWindowsDriverPreflightTests.swift": 57,
              "apps/macos/Tests/BridgeVMControlTests/HvfWindowsProductInjectionPreflightTests.swift": 19,
              "apps/macos/Tests/BridgeVMControlTests/HvfWindowsStaleInjectionMarkerTests.swift": 22,
              "tests/integration/hvf-windows-product-injection-deny-smoke.sh": 17,
          }

          present = set()
          out = []
          for line in lines:
              if line and not line.startswith("#"):
                  path = line.split("\t", 1)[0]
                  present.add(path)
                  if path in updates:
                      line = f"{path}\t{updates[path]}\t0"
              out.append(line)

          missing_updates = sorted(set(updates) - present)
          if missing_updates:
              raise SystemExit(f"missing existing budget rows: {missing_updates}")

          def insert_after(anchor: str, rows: list[tuple[str, int]]) -> None:
              nonlocal_out = out
              index = next((i for i, line in enumerate(nonlocal_out)
                            if line.startswith(anchor + "\t")), None)
              if index is None:
                  raise SystemExit(f"missing insertion anchor: {anchor}")
              additions = [f"{path}\t{loc}\t0" for path, loc in rows if path not in present]
              nonlocal_out[index + 1:index + 1] = additions
              present.update(path for path, _ in rows)

          insert_after(
              "apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsInstall.swift",
              [("apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowsDriverPreflight.swift", 45)],
          )
          insert_after(
              "apps/macos/Tests/BridgeVMControlTests/HvfWindowsImportTests.swift",
              [
                  ("apps/macos/Tests/BridgeVMControlTests/HvfWindowsProductInjectionPreflightTests.swift", 19),
                  ("apps/macos/Tests/BridgeVMControlTests/HvfWindowsStaleInjectionMarkerTests.swift", 22),
              ],
          )
          insert_after(
              "apps/macos/Tests/BridgeVMControlTests/HvfWindowsInstallTests.swift",
              [("apps/macos/Tests/BridgeVMControlTests/HvfWindowsDriverPreflightTests.swift", 57)],
          )
          insert_after(
              "tests/integration/hvf-windows-viogpu3d-build-kit-smoke.sh",
              [("tests/integration/hvf-windows-product-injection-deny-smoke.sh", 17)],
          )

          missing_new = sorted(set(new_rows) - present)
          if missing_new:
              raise SystemExit(f"failed to register budget rows: {missing_new}")
          budget_path.write_text("\n".join(out) + "\n")

          check = Path("scripts/check-project.sh")
          text = check.read_text()
          marker = 'step "active IOSurface capture" tests/integration/active-iosurface-capture-smoke.py\n'
          addition = 'step "Windows product injection deny" tests/integration/hvf-windows-product-injection-deny-smoke.sh\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit("check-project insertion marker missing")
              text = text.replace(marker, marker + addition, 1)
          check.write_text(text)
          PY

          git add "${paths[@]}" scripts/refactor-budgets.tsv scripts/check-project.sh
          tests/integration/hvf-windows-product-injection-deny-smoke.sh
          scripts/check-refactor-budgets.sh >/tmp/a9-budgets.log
          git diff --cached --check
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit -m "security: make Windows-HVF product injection inert [a9-port-complete]" -m "Port only the final fail-closed install/import surface and its no-mutation tests. Remove cached injector, marker, placeholder NSID and boot-timer authorization paths while preserving explicit lab tooling."
          git push origin HEAD:takeover/a9-fail-closed
