name: Windows ARM64 UMD

on:
  push:
    branches: [main]
    paths:
      - "scripts/patches/virtio-win-mesa-*.patch"
      - "scripts/win-assets/build-mesa-arm64.ps1"
      - "scripts/win-assets/mesa-cross-arm64.ini"
      - ".github/workflows/windows-umd.yml"
  pull_request:
    paths:
      - "scripts/patches/virtio-win-mesa-*.patch"
      - "scripts/win-assets/build-mesa-arm64.ps1"
      - "scripts/win-assets/mesa-cross-arm64.ini"
      - ".github/workflows/windows-umd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-umd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-integrity:
    name: pinned Mesa patch integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arehnman/virtio-win-mesa
          ref: cb531c440ff34a9c6334859dda0848132be49ec3
          path: mesa
          fetch-depth: 1
      - name: Apply the exact BridgeVM patch stack
        run: |
          git -C mesa apply --check "$GITHUB_WORKSPACE/scripts/patches/virtio-win-mesa-unbound-clear.patch"
          git -C mesa apply "$GITHUB_WORKSPACE/scripts/patches/virtio-win-mesa-unbound-clear.patch"
          git -C mesa apply --check "$GITHUB_WORKSPACE/scripts/patches/virtio-win-mesa-submit-trace.patch"
          git -C mesa apply "$GITHUB_WORKSPACE/scripts/patches/virtio-win-mesa-submit-trace.patch"
          git -C mesa diff --check
      - name: Prove resource registration fails closed
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("mesa/src/gallium/winsys/virgl/gdi")
          source = (root / "virgl_gdi_winsys.c").read_text()
          header = (root / "virgl_gdi_winsys.h").read_text()

          def section(text: str, start: str, end: str) -> str:
              begin = text.index(start)
              finish = text.index(end, begin + len(start))
              return text[begin:finish]

          assert "bool resource_list_failed;" in header

          grow = section(
              source,
              "static bool\nvirgl_gdi_cmd_buf_grow_res_list",
              "static void\nvirgl_gdi_cmd_buf_build_alloc_lists",
          )
          assert "REALLOC(" not in grow
          assert grow.count("CALLOC(") == 2
          assert "FREE(cbuf->res_bo);" in grow
          assert "FREE(cbuf->res_write);" in grow

          add = section(
              source,
              "static bool\nvirgl_gdi_cmd_buf_add_res",
              "static void\nvirgl_gdi_emit_res",
          )
          assert "cbuf->resource_list_failed = true;" in add
          assert "return false;" in add

          emit = section(
              source,
              "static void\nvirgl_gdi_emit_res",
              "static void\nvirgl_gdi_mark_res_write",
          )
          guard = emit.index("if (!virgl_gdi_cmd_buf_add_res")
          handle = emit.index("res->res_handle")
          assert guard < handle

          submit = section(
              source,
              "static int\nvirgl_gdi_winsys_submit_cmd",
              "static void\nvirgl_gdi_winsys_destroy",
          )
          refusal = submit.index("if (cbuf->resource_list_failed)")
          render = submit.index("cbuf->ctx->render")
          assert refusal < render
          assert 'bridgevm_trace_submit("resource-list-failed"' in submit
          print("PASS: UMD resource-list failure cannot emit or submit an untracked resource")
          PY

  build-arm64:
    name: build patched Windows ARM64 UMD
    needs: patch-integrity
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arehnman/virtio-win-mesa
          ref: cb531c440ff34a9c6334859dda0848132be49ec3
          path: mesa
          fetch-depth: 1
      - name: Apply the exact BridgeVM patch stack
        shell: pwsh
        run: |
          git -C mesa apply --check "$env:GITHUB_WORKSPACE/scripts/patches/virtio-win-mesa-unbound-clear.patch"
          if ($LASTEXITCODE -ne 0) { throw "unbound-clear patch check failed" }
          git -C mesa apply "$env:GITHUB_WORKSPACE/scripts/patches/virtio-win-mesa-unbound-clear.patch"
          if ($LASTEXITCODE -ne 0) { throw "unbound-clear patch failed" }
          git -C mesa apply --check "$env:GITHUB_WORKSPACE/scripts/patches/virtio-win-mesa-submit-trace.patch"
          if ($LASTEXITCODE -ne 0) { throw "submit/resource-list patch check failed" }
          git -C mesa apply "$env:GITHUB_WORKSPACE/scripts/patches/virtio-win-mesa-submit-trace.patch"
          if ($LASTEXITCODE -ne 0) { throw "submit/resource-list patch failed" }
      - name: Install pinned native parser tools
        shell: pwsh
        run: |
          choco install winflexbison3 --version=2.5.24.20210105 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "winflexbison3 install failed" }
          python -m pip install --disable-pip-version-check meson==1.7.2 ninja==1.11.1.4 packaging==25.0 mako==1.3.10 PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw "Mesa Python tool install failed" }
      - name: Cross-build the ARM64 UMD payload
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($vsroot)) { throw "Visual Studio ARM64 tools are missing" }
          $devcmd = Join-Path $vsroot "Common7\Tools\VsDevCmd.bat"
          $wdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $wdk = Get-ChildItem -LiteralPath $wdkRoot -Directory |
            Sort-Object Name -Descending |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "um\d3d10umddi.h")) -and
              (Test-Path (Join-Path $_.FullName "um\d3dkmthk.h"))
            } |
            Select-Object -First 1
          if ($null -eq $wdk) {
            Write-Host "Available Windows Kit D3D headers:"
            Get-ChildItem -LiteralPath $wdkRoot -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @("d3d10umddi.h", "d3dkmthk.h", "d3dkmddi.h") } |
              ForEach-Object { Write-Host $_.FullName }
            throw "Windows SDK D3D UMD headers are missing"
          }

          $cmdPath = Join-Path $env:RUNNER_TEMP "build-bridgevm-umd.cmd"
          @"
          @echo off
          call "$devcmd" -arch=arm64 -host_arch=x64
          if errorlevel 1 exit /b 11
          set "PATH=C:\Program Files\LLVM\bin;C:\ProgramData\chocolatey\bin;%PATH%"
          set "INCLUDE=$($wdk.FullName)\um;$($wdk.FullName)\shared;%INCLUDE%"
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\win-assets\build-mesa-arm64.ps1" -MesaSrc "$env:GITHUB_WORKSPACE\mesa" -Prefix "$env:GITHUB_WORKSPACE\mesa-prefix-arm64" -CrossFileBase "$env:GITHUB_WORKSPACE\scripts\win-assets\mesa-cross-arm64.ini"
          exit /b %ERRORLEVEL%
          "@ | Set-Content -LiteralPath $cmdPath -Encoding Ascii
          & cmd.exe /d /s /c "`"$cmdPath`""
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 UMD build failed with $LASTEXITCODE" }
      - name: Record payload hashes
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE "mesa-prefix-arm64\bin"
          $required = @("libEGL.dll", "libGLESv2.dll", "opengl32.dll", "viogpu_d3d10.dll", "viogpu_wgl.dll")
          $lines = foreach ($name in $required) {
            $path = Join-Path $bin $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing payload: $name" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -LiteralPath (Join-Path $bin "SHA256SUMS") -Encoding Ascii
          $lines | ForEach-Object { Write-Host $_ }
      - name: Retain the exact patched UMD build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridgevm-windows-arm64-umd-${{ github.sha }}
          path: mesa-prefix-arm64/bin/*
          if-no-files-found: error
          retention-days: 14
