name: Native pointer encoding contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pointer-input:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check pointer builder with Windows PowerShell 5.1
        shell: powershell
        run: scripts/test-bvagent-pointer-input.ps1
      - name: Check pointer builder with PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: scripts/test-bvagent-pointer-input.ps1
