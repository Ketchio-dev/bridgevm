name: Native pointer encoding contracts
on: {push: {}, pull_request: {paths: ['scripts/test-bvagent-pointer-*', 'scripts/win-assets/bvagent-*-input.cs', 'scripts/win-assets/bvagent-input.ps1', '.github/workflows/pointer-input-contract.yml']}}
permissions:
  contents: read
jobs:
  pointer-input:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check pointer builder with Windows PowerShell 5.1
        shell: powershell
        run: scripts/test-bvagent-pointer-release.ps1
      - name: Check pointer builder with PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: scripts/test-bvagent-pointer-release.ps1
