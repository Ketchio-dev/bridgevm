name: Guest input diagnostic controller contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tests/integration/guest-input-controller-test.py; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; python tests/integration/guest-input-controller-framing-test.py
      - run: ./scripts/test-guest-input-controller-wire.ps1 -Python python
