name: Guest input diagnostic controller contracts
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/live-gates/guest_input_*', 'scripts/test-guest-input-controller-wire.ps1', 'scripts/win-assets/bvagent-*-input.cs', 'tests/integration/guest-input-controller-*', '.github/workflows/guest-input-controller.yml']}}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python tests/integration/guest-input-controller-test.py && python tests/integration/guest-input-controller-framing-test.py
      - run: pwsh -NoProfile -File scripts/test-guest-input-controller-wire.ps1 -Python python
