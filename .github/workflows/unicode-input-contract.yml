name: Unicode input encoding contracts
on: {push: {}, pull_request: {paths: ['scripts/test-bvagent-input-*', 'scripts/test-bvagent-key-*', 'scripts/test-bvagent-unicode-*', 'scripts/win-assets/bv-window-inventory.cs', 'scripts/win-assets/bvagent*', '.github/workflows/unicode-input-contract.yml']}}
permissions:
  contents: read
jobs:
  unicode-input:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check Unicode input with Windows PowerShell 5.1
        shell: powershell
        run: scripts/test-bvagent-unicode-input.ps1
      - name: Check Unicode input with PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: scripts/test-bvagent-unicode-input.ps1
