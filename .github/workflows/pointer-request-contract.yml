name: Native pointer request contracts
on: {push: {}, pull_request: {paths: ['scripts/test-bvagent-input-dispatch.ps1', 'scripts/test-bvagent-pointer-request.ps1', 'scripts/win-assets/bvagent-*-input.cs', 'scripts/win-assets/bvagent-input.ps1', 'scripts/win-assets/bvagent.ps1', '.github/workflows/pointer-request-contract.yml']}}
permissions:
  contents: read
jobs:
  pointer-request:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check pointer requests with Windows PowerShell 5.1
        shell: powershell
        run: scripts/test-bvagent-pointer-request.ps1; scripts/test-bvagent-input-dispatch.ps1
      - name: Check pointer requests with PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: scripts/test-bvagent-pointer-request.ps1; scripts/test-bvagent-input-dispatch.ps1
