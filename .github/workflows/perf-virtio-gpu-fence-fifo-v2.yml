name: One-shot virtio-gpu fence FIFO verifier v2

on:
  push:
    branches:
      - perf/virtio-gpu-fence-fifo

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Replace indexed fence removals with FIFO retirement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          device = Path('crates/bridgevm-hvf/src/virtio_gpu/device.rs')
          text = device.read_text()
          for old, new in [
              (
                  'pub(crate) pending_fenced: Vec<PendingFencedResponse>,',
                  'pub(crate) pending_fenced: VecDeque<PendingFencedResponse>,',
              ),
              ('pending_fenced: Vec::new(),', 'pending_fenced: VecDeque::new(),'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'device fence queue anchor changed: {old}')
              text = text.replace(old, new, 1)
          device.write_text(text)

          virtqueue = Path('crates/bridgevm-hvf/src/virtio_gpu/virtqueue.rs')
          text = virtqueue.read_text()
          old = 'self.pending_fenced.push(PendingFencedResponse {'
          new = 'self.pending_fenced.push_back(PendingFencedResponse {'
          if text.count(old) != 1:
              raise SystemExit('fenced response enqueue anchor changed')
          virtqueue.write_text(text.replace(old, new, 1))

          fence = Path('crates/bridgevm-hvf/src/virtio_gpu/fence.rs')
          text = fence.read_text()
          start_marker = '        let mut index = 0;\n'
          end_marker = '            let pending_response = self.pending_fenced.remove(index);\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('indexed fence retirement line markers changed')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = ''.join([
              '        for _ in 0..self.pending_fenced.len() {\n',
              '            let pending_response = self\n',
              '                .pending_fenced\n',
              '                .pop_front()\n',
              '                .expect("pending fence count came from the queue length");\n',
              '            let ready = completed.iter().any(|completed| {\n',
              '                completed.ctx_id == pending_response.fence.ctx_id\n',
              '                    && completed.ring_idx == pending_response.fence.ring_idx\n',
              '                    && completed.fence_id >= pending_response.fence.fence_id\n',
              '            });\n',
              '            if !ready {\n',
              '                self.pending_fenced.push_back(pending_response);\n',
              '                continue;\n',
              '            }\n\n',
          ])
          fence.write_text(text[:start] + replacement + text[end:])

          part3 = Path('crates/bridgevm-hvf/src/virtio_gpu/tests/part_3.rs')
          text = part3.read_text()
          pointer_line = '    let pending_ptr = dev.gpu.pending_fenced.as_ptr();\n'
          pointer_assert = '    assert_eq!(dev.gpu.pending_fenced.as_ptr(), pending_ptr);\n'
          if text.count(pointer_line) != 1:
              raise SystemExit('pending Vec pointer setup anchor changed')
          if text.count(pointer_assert) != 2:
              raise SystemExit('pending Vec pointer assertion anchors changed')
          part3.write_text(text.replace(pointer_line, '', 1).replace(pointer_assert, ''))

          tests_mod = Path('crates/bridgevm-hvf/src/virtio_gpu/tests/mod.rs')
          text = tests_mod.read_text()
          anchor = 'mod descriptor_chain_trace;\n'
          if text.count(anchor) != 1 or 'mod fence_fifo;' in text:
              raise SystemExit('virtio-gpu fence test module anchor changed')
          tests_mod.write_text(text.replace(anchor, anchor + 'mod fence_fifo;\n', 1))

          test_path = Path('crates/bridgevm-hvf/src/virtio_gpu/tests/fence_fifo.rs')
          if test_path.exists():
              raise SystemExit('fence FIFO regression already exists')
          test_path.write_bytes(base64.b64decode(''))
          PY

          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          import re

          declaration = re.compile(
              r'^\s*(?:(?:pub\s+)?(?:mod|use)\s+[^;{]*;|#\[path\s*=\s*[^]]*\])\s*$'
          )

          def structural_loc(path: str) -> int:
              header = True
              loc = 0
              for line in Path(path).read_text().splitlines():
                  if header and re.match(r'^\s*//!', line):
                      continue
                  if header and re.match(r'^\s*$', line):
                      header = False
                      continue
                  header = False
                  if declaration.match(line):
                      continue
                  loc += 1
              return loc

          budgets_path = Path('scripts/refactor-budgets.tsv')
          budgets = budgets_path.read_text()
          existing = [
              'crates/bridgevm-hvf/src/virtio_gpu/device.rs',
              'crates/bridgevm-hvf/src/virtio_gpu/fence.rs',
              'crates/bridgevm-hvf/src/virtio_gpu/virtqueue.rs',
              'crates/bridgevm-hvf/src/virtio_gpu/tests/part_3.rs',
          ]
          for path in existing:
              pattern = re.compile(rf'^{re.escape(path)}\t(\d+)\t0$', re.MULTILINE)
              match = pattern.search(budgets)
              if match is None:
                  raise SystemExit(f'budget row missing: {path}')
              old_ceiling = int(match.group(1))
              loc = structural_loc(path)
              if loc > old_ceiling:
                  raise SystemExit(f'{path} grew from ceiling {old_ceiling} to {loc}')
              budgets = pattern.sub(f'{path}\t{loc}\t0', budgets, count=1)

          test_path = 'crates/bridgevm-hvf/src/virtio_gpu/tests/fence_fifo.rs'
          if re.search(rf'^{re.escape(test_path)}\t', budgets, re.MULTILINE):
              raise SystemExit('fence FIFO test budget already exists')
          anchor_pattern = re.compile(
              r'^crates/bridgevm-hvf/src/virtio_gpu/tests/descriptor_chain_trace.rs\t\d+\t0$',
              re.MULTILINE,
          )
          anchor = anchor_pattern.search(budgets)
          if anchor is None:
              raise SystemExit('fence FIFO budget insertion anchor changed')
          row = f'{test_path}\t{structural_loc(test_path)}\t0'
          budgets = budgets[:anchor.end()] + '\n' + row + budgets[anchor.end():]
          budgets_path.write_text(budgets)
          PY

          grep -q 'pending_fenced: VecDeque<PendingFencedResponse>' crates/bridgevm-hvf/src/virtio_gpu/device.rs
          grep -q 'pending_fenced.push_back' crates/bridgevm-hvf/src/virtio_gpu/virtqueue.rs
          grep -q '\.pop_front()' crates/bridgevm-hvf/src/virtio_gpu/fence.rs
          ! grep -q 'pending_fenced.remove' crates/bridgevm-hvf/src/virtio_gpu/fence.rs
          for attempt in $(seq 1 10); do
            echo "virtio-gpu fence FIFO regression attempt ${attempt}/10"
            cargo test -p bridgevm-hvf --locked \
              fence_retirement_delivers_ready_entries_and_preserves_unready_fifo_order
          done
          cargo test -p bridgevm-hvf --locked
          cargo clippy -p bridgevm-hvf --all-targets --locked -- -D warnings
          scripts/check-refactor-budgets.sh
          git diff --check

          rm -f .github/workflows/perf-virtio-gpu-fence-fifo-v2.yml
          git add -A
          git config user.name Ketchio-dev
          git config user.email 116458462+Ketchio-dev@users.noreply.github.com
          git commit \
            -m 'gpu: retire completed fences through a FIFO [gpu-fence-fifo-complete]' \
            -m 'Store pending fence responses in VecDeque and scan exactly the initial queue length with pop_front/push_back. Ready responses retain delivery order, unready responses retain queue order, and repeated Vec::remove(index) tail shifts disappear without changing fence matching, used-ring writes, interrupts, or buffer recycling.'
          git push origin HEAD:perf/virtio-gpu-fence-fifo
