name: Coherence inventory restart ordering contracts
on: {push: {}, pull_request: {paths: ['apps/macos/Sources/BridgeVMControl/HvfEngine/HvfGuestResetRecord.swift', 'apps/macos/Sources/BridgeVMControl/HvfEngine/HvfWindowInventoryRequest.swift', 'apps/macos/Sources/BridgeVMWindowProtocol/**', 'scripts/check-window-inventory-restart.sh', 'tests/integration/window-inventory-restart.swift', '.github/workflows/window-inventory-restart.yml']}}
permissions:
  contents: read
jobs:
  inventory:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-window-inventory-restart.sh
