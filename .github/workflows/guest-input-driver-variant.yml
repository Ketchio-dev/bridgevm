name: Sealed production input driver profile contracts
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/live-gates/guest_input_*', 'tests/integration/guest-input-controller-test.py', 'tests/integration/guest-input-driver-variant-test.py', 'tests/integration/guest-input-queue-test.py', '.github/workflows/guest-input-driver-variant.yml']}}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/integration/guest-input-driver-variant-test.py
      - run: python3 tests/integration/guest-input-queue-test.py && python3 tests/integration/guest-input-controller-test.py
