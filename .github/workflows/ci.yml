name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    # Hosted macOS runners lack nested virtualization, so tests that boot a
    # real VM must be #[ignore]-d or env-gated (BRIDGEVM_LIVE_*).
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
      - run: cargo test --workspace --locked
      - name: every file containing a test contributes one to a binary
        run: python3 scripts/check-tests-are-reachable.py

  check-venus:
    name: check venus feature
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
      - run: cargo check -p bridgevm-hvf --all-targets --features venus --locked

  test-venus-native:
    name: test venus native
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Venus paths
        run: |
          echo "BRIDGEVM_3D_DIR=$RUNNER_TEMP/bridgevm-3d" >> "$GITHUB_ENV"
          echo "BRIDGEVM_VENUS_PREFIX=$RUNNER_TEMP/bridgevm-3d/prefix" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: venus-native
      - name: Cache patched virglrenderer
        id: virgl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bridgevm-3d
          key: virgl-macos-15-arm64-2a173ee-${{ hashFiles('scripts/build-venus-host-deps.sh', 'scripts/patches/virglrenderer-macos-venus.patch') }}
      - name: Install Venus build dependencies
        run: |
          brew install meson ninja pkgconf libepoxy molten-vk vulkan-loader vulkan-headers
          python3 -m pip install --break-system-packages pyyaml
      - name: Build patched virglrenderer
        if: steps.virgl-cache.outputs.cache-hit != 'true'
        run: scripts/build-venus-host-deps.sh
      - name: Verify native Venus artifacts
        run: scripts/verify-venus-native-artifacts.sh
      - name: Link and test Venus support
        run: cargo test -p bridgevm-hvf --lib --features venus --locked
      - name: Run Venus host probe
        run: scripts/run-venus-host-probe.sh
      # GitHub-hosted macOS currently cannot create a CGL pixel format/context
      # (CGLChoosePixelFormat returns 10002). Keep this probe visible, but do
      # not weaken the required native build/link/740-test/host-probe gate.
      - name: Run Venus device smoke (hosted advisory)
        continue-on-error: true
        run: scripts/run-venus-device-smoke.sh

  msrv:
    name: msrv (1.85)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
      - run: cargo check --workspace --locked

  linux-stubs:
    # The Linux guest tools and the platform stubs must keep compiling for the
    # guest target. check-project.sh checks this only when the target happens to
    # be installed locally, so nothing guaranteed it.
    name: cross-compile (linux stubs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
      # Warnings are expected: macOS-only items are dead code on this target.
      - run: cargo check --workspace --target aarch64-unknown-linux-gnu --locked

  budgets:
    name: refactor budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-refactor-budgets.sh

  swift:
    # The macOS app's suites are the largest body of tests in the repository and
    # were verified only by running check-project.sh by hand, so a regression in
    # them could reach main. They need Swift, hence a macOS runner.
    name: macOS app suites
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build --package-path apps/macos
      - run: bash scripts/run-swift-tests.sh
      - run: bash scripts/run-xctest-shim-suites.sh
      # A release build is what ships, and it is the only thing that can prove
      # the development overrides are absent from it. check-project.sh skips
      # this check unless a release build already exists, which on a runner it
      # never does.
      - run: swift build --package-path apps/macos -c release
      - run: bash scripts/check-release-overrides.sh
      # The installer's malicious-input and rollback gate needs codesign, so it
      # runs here rather than in the Linux truth job.
      - run: bash tests/integration/install-verify-smoke.sh

  truth:
    # Keeps the capability registry, the generated claim blocks and the
    # documentation manifest from drifting apart. Deterministic and free of
    # live virtualization, so it belongs on a hosted runner.
    name: capability and documentation drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: capability registry is valid and generated blocks are current
        run: python3 scripts/render-capability-status.py --check
      - name: machine contract and schema are valid JSON
        run: |
          python3 -m json.tool docs/machine-contract/qemu-virt-deviations.json >/dev/null
          python3 -m json.tool schemas/bridgevm-capability-v1.json >/dev/null
          python3 -m json.tool capabilities/windows-hvf.json >/dev/null
      - name: cited capability evidence contains the figures it is cited for
        run: python3 scripts/check-capability-evidence.py
      - name: capability test-count claims match the tests that exist
        run: python3 scripts/check-capability-test-counts.py
      - name: every Markdown document is classified
        run: bash scripts/check-documentation-system.sh
      - name: current documents cite flags, paths and commits that exist
        run: python3 scripts/check-doc-references.py
      - name: attribution and known-defect disclosure are intact
        run: bash scripts/check-attribution-honesty.sh
      - name: the virgl integer-attribute rule stays provenance-scoped
        run: bash scripts/check-virgl-integer-attributes.sh
      - name: HVF Windows Coherence protocol
        run: bash scripts/check-hvf-windows-coherence-protocol.sh
      - name: the gate scripts themselves are free of the enforced defect classes
        run: bash scripts/check-shell-scripts.sh
      - name: every tracked Python script compiles
        run: python3 scripts/check-python-scripts.py
      - name: the workflows parse and keep their required jobs
        run: |
          python3 -m pip install --break-system-packages --quiet pyyaml
          python3 scripts/check-workflow-yaml.py
      - name: every declared daemon DTO coding key is actually decoded
        run: python3 scripts/check-daemon-dto-decoders.py
      - name: the app sources contain no force casts
        run: python3 scripts/check-swift-force-casts.py
      - name: the install bootstrap pins the installer it ships
        run: bash scripts/check-install-bootstrap.sh

  stable-advisory:
    name: latest stable advisory
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: stable-advisory
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
