name: Guest input controller Windows builder contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  builders:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: ./scripts/test-guest-input-controller-wire.ps1 -Python python
