name: Coherence multiwindow diagnostic contracts
on: {push: {}, pull_request: {paths: ['scripts/live-gates/coherence_*', 'scripts/live-gates/guest_input_*', 'scripts/test-coherence-multiwindow.ps1', 'scripts/win-assets/bv-coherence-*', 'scripts/win-assets/bv-window-inventory.cs', 'tests/integration/coherence-inventory-observation-test.py', '.github/workflows/coherence-multiwindow.yml']}}
permissions:
  contents: read
jobs:
  host:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python tests/integration/coherence-inventory-observation-test.py
  guest-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: scripts/test-coherence-multiwindow.ps1
      - shell: pwsh
        run: scripts/test-coherence-multiwindow.ps1
