name: Glyph pixel evidence contracts
on:
  push: {branches: [main]}
  pull_request: {paths: ['scripts/build-glyph-pixel-mask.py', 'scripts/glyph_frame.py', 'scripts/verify-glyph-pixel-mask.py', 'tests/integration/glyph-ppm-contract.py', '.github/workflows/glyph-pixel-contracts.yml']}
permissions:
  contents: read
jobs:
  ppm-contracts:
    # Pure Python with no platform branch or host tool, so Linux covers it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tests/integration/glyph-ppm-contract.py
      - run: python3 scripts/build-glyph-pixel-mask.py --self-test
      - run: python3 scripts/verify-glyph-pixel-mask.py --self-test
