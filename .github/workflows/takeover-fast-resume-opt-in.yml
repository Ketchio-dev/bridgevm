name: One-shot Fast resume opt-in verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'takeover/fast-resume-opt-in-guard'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Format, reseal budgets, and verify both resume paths
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          import re

          declaration = re.compile(
              r'^\s*(?:(?:pub\s+)?(?:mod|use)\s+[^;{]*;|#\[path\s*=\s*[^]]*\])\s*$'
          )

          def structural_loc(path: str) -> int:
              header = True
              loc = 0
              for line in Path(path).read_text().splitlines():
                  if header and re.match(r'^\s*//!', line):
                      continue
                  if header and re.match(r'^\s*$', line):
                      header = False
                      continue
                  header = False
                  if declaration.match(line):
                      continue
                  loc += 1
              return loc

          budgets_path = Path('scripts/refactor-budgets.tsv')
          budgets = budgets_path.read_text()
          backend_path = 'crates/bridgevm-daemon/src/backend_lifecycle.rs'
          test_path = 'crates/bridgevm-daemon/src/tests_split/fast_resume_opt_in.rs'
          backend_loc = structural_loc(backend_path)
          test_loc = structural_loc(test_path)

          backend_pattern = re.compile(
              rf'^{re.escape(backend_path)}\t(\d+)\t0$', re.MULTILINE
          )
          match = backend_pattern.search(budgets)
          if match is None:
              raise SystemExit('backend lifecycle budget row missing')
          old_backend_ceiling = int(match.group(1))
          if backend_loc > old_backend_ceiling:
              raise SystemExit(
                  f'backend lifecycle grew from ceiling {old_backend_ceiling} to {backend_loc}'
              )
          budgets = backend_pattern.sub(
              f'{backend_path}\t{backend_loc}\t0', budgets, count=1
          )

          if re.search(rf'^{re.escape(test_path)}\t', budgets, re.MULTILINE):
              raise SystemExit('Fast resume test budget row already exists')
          anchor = 'crates/bridgevm-daemon/src/tests_split/helpers.rs\t178\t0\n'
          if budgets.count(anchor) != 1:
              raise SystemExit('daemon test budget insertion anchor changed')
          budgets = budgets.replace(
              anchor,
              anchor + f'{test_path}\t{test_loc}\t0\n',
              1,
          )
          budgets_path.write_text(budgets)
          print(f'resealed {backend_path}: {old_backend_ceiling} -> {backend_loc}')
          print(f'registered {test_path}: {test_loc}')
          PY

          for attempt in $(seq 1 10); do
            echo "Fast resume opt-in regressions attempt ${attempt}/10"
            cargo test -p bridgevm-daemon --locked fast_resume_opt_in
          done
          cargo clippy -p bridgevm-daemon --all-targets --locked -- -D warnings
          scripts/check-refactor-budgets.sh
          git diff --check

          rm -f .github/workflows/takeover-fast-resume-opt-in.yml
          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "daemon: require explicit Fast resume real-start opt-in [fast-resume-opt-in-complete]" \
            -m "Remove the daemon's detached generic-API fallback when Fast Mode real start is disabled. Preserve the suspended VM and saved state on refusal, prove the enabled path restores into a daemon-supervised child, and reseal structural budgets at the formatted final sizes."
          git push origin HEAD:takeover/fast-resume-opt-in-guard
