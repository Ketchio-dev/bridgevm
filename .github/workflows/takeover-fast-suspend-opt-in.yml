name: One-shot Fast suspend opt-in verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'takeover/fast-suspend-opt-in-guard'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Format, reseal budgets, and verify Fast lifecycle policy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          import re

          declaration = re.compile(
              r'^\s*(?:(?:pub\s+)?(?:mod|use)\s+[^;{]*;|#\[path\s*=\s*[^]]*\])\s*$'
          )

          def structural_loc(path: str) -> int:
              header = True
              loc = 0
              for line in Path(path).read_text().splitlines():
                  if header and re.match(r'^\s*//!', line):
                      continue
                  if header and re.match(r'^\s*$', line):
                      header = False
                      continue
                  header = False
                  if declaration.match(line):
                      continue
                  loc += 1
              return loc

          budgets_path = Path('scripts/refactor-budgets.tsv')
          budgets = budgets_path.read_text()
          existing = [
              'crates/bridgevm-daemon/src/backend_lifecycle.rs',
              'crates/bridgevm-daemon/src/tests_split/fast_resume_opt_in.rs',
          ]
          measured = {}
          for path in existing:
              pattern = re.compile(rf'^{re.escape(path)}\t(\d+)\t0$', re.MULTILINE)
              match = pattern.search(budgets)
              if match is None:
                  raise SystemExit(f'budget row missing: {path}')
              old_ceiling = int(match.group(1))
              loc = structural_loc(path)
              if loc > old_ceiling:
                  raise SystemExit(f'{path} grew from ceiling {old_ceiling} to {loc}')
              budgets = pattern.sub(f'{path}\t{loc}\t0', budgets, count=1)
              measured[path] = loc
              print(f'resealed {path}: {old_ceiling} -> {loc}')

          additions = [
              (
                  'crates/bridgevm-daemon/src/backend_lifecycle/fast.rs',
                  'crates/bridgevm-daemon/src/backend_lifecycle.rs',
              ),
              (
                  'crates/bridgevm-daemon/src/tests_split/fast_restore_supervision.rs',
                  'crates/bridgevm-daemon/src/tests_split/fast_resume_opt_in.rs',
              ),
          ]
          for path, anchor_path in additions:
              if re.search(rf'^{re.escape(path)}\t', budgets, re.MULTILINE):
                  raise SystemExit(f'new budget row already exists: {path}')
              loc = structural_loc(path)
              anchor_loc = measured.get(anchor_path, structural_loc(anchor_path))
              anchor = f'{anchor_path}\t{anchor_loc}\t0\n'
              if budgets.count(anchor) != 1:
                  raise SystemExit(f'budget insertion anchor changed: {anchor_path}')
              budgets = budgets.replace(anchor, anchor + f'{path}\t{loc}\t0\n', 1)
              measured[path] = loc
              print(f'registered {path}: {loc}')

          budgets_path.write_text(budgets)
          PY

          for attempt in $(seq 1 10); do
            echo "Fast lifecycle opt-in regressions ${attempt}/10"
            cargo test -p bridgevm-daemon --locked fast_resume_opt_in
            cargo test -p bridgevm-daemon --locked fast_restore_supervision
          done
          for attempt in $(seq 1 5); do
            echo "complete daemon isolation run ${attempt}/5"
            cargo test -p bridgevm-daemon --locked
          done
          cargo clippy -p bridgevm-daemon --all-targets --locked -- -D warnings
          scripts/check-refactor-budgets.sh
          git diff --check

          rm -f .github/workflows/takeover-fast-suspend-opt-in.yml
          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "daemon: require Fast suspend real-start opt-in [fast-suspend-opt-in-complete]" \
            -m "Share the Fast lifecycle real-start guard between suspend and resume. Refuse daemon Fast suspend before helper launch when explicit opt-in is absent, preserve all pre-request state, isolate positive restore supervision coverage, and reseal every structural budget at the formatted measured size. Closes #121."
          git push origin HEAD:takeover/fast-suspend-opt-in-guard
