name: Injector binary comparison contract
on: {push: {}, pull_request: {paths: ['scripts/build-hvf-windows-driver-injector.sh', 'scripts/injector-file-compare-build.sh', 'scripts/win-assets/bv-file-compare.c', 'scripts/win-assets/bvinject.cmd', 'tests/integration/injector-file-compare-*', '.github/workflows/injector-file-compare.yml']}}
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare complete binary streams and fail closed
        env:
          CC: clang -D_CRT_SECURE_NO_WARNINGS
        run: python tests/integration/injector-file-compare-contract.py
