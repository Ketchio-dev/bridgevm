name: One-shot pointer earliest wake deadline fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'takeover/pointer-earliest-wake-deadline'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply and verify the earliest-deadline fix
        shell: bash
        run: |
          set -euo pipefail
          source_sha=99c5b61d2a14bf1d489aa74d700304fa2d982f55
          mkdir -p .github/scripts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Ketchio-dev/bridgevm/${source_sha}/.github/scripts/apply-pointer-earliest-deadline.py" \
            -o .github/scripts/apply-pointer-earliest-deadline.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply-pointer-earliest-deadline.py")
          text = path.read_text()
          old = '''    include = ''' + "'''" + '''
          #[path = "pointer_deadline_tests.rs"]
          mod pointer_deadline_tests;
          ''' + "'''" + '''
          '''
          new = '''    include = ''' + "'''" + '''#[path = "pointer_deadline_tests.rs"]
          mod pointer_deadline_tests;
          ''' + "'''" + '''
          '''
          if text.count(old) != 1:
              raise SystemExit("pointer test include anchor changed")
          path.write_text(text.replace(old, new, 1))
          PY

          python3 .github/scripts/apply-pointer-earliest-deadline.py code
          python3 - <<'PY'
          from pathlib import Path

          pointer = Path("crates/bridgevm-hvf/examples/hvf_gic_boot_probe/xhci_hid_input/pointer_input.rs")
          helper = Path("crates/bridgevm-hvf/examples/hvf_gic_boot_probe/xhci_hid_input/pointer_deadline.rs")
          text = pointer.read_text()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              "use super::pointer_deadline::next_deadline;\n",
              "use super::pointer_deadline::{next_deadline, PointerRamfbDelayCheckpoint};\n",
              "deadline import",
          )
          text = replace_once(
              text,
              """#[derive(Debug)]
          struct PointerRamfbDelayCheckpoint {
              label: String,
              delay: Duration,
              emitted: bool,
          }

          """,
              "",
              "checkpoint type extraction",
          )
          text = replace_once(
              text,
              """        if let Some(deadline) = next_deadline(
                      now,
                      [platform.xhci_pointer_report_deadline(), self.next_checkpoint_deadline()],
                  ) {
                      return Some(deadline);
                  }
          """,
              """        if let Some(deadline) = next_deadline(
                      now,
                      platform.xhci_pointer_report_deadline(),
                      self.fired_at,
                      &self.ramfb_delay_checkpoints,
                  ) {
                      return Some(deadline);
                  }
          """,
              "earliest deadline call",
          )
          text = replace_once(
              text,
              """    fn next_checkpoint_deadline(&self) -> Option<Instant> {
                  let fired_at = self.fired_at?;
                  self.ramfb_delay_checkpoints.iter().find(|c| !c.emitted)
                      .and_then(|c| fired_at.checked_add(c.delay))
              }

          """,
              "",
              "checkpoint deadline extraction",
          )
          pointer.write_text(text)

          helper.write_text(
              """//! Shared ordering for pointer pacing and diagnostic checkpoint wakeups.

          use std::time::{Duration, Instant};

          #[derive(Debug)]
          pub(super) struct PointerRamfbDelayCheckpoint {
              pub(super) label: String,
              pub(super) delay: Duration,
              pub(super) emitted: bool,
          }

          pub(super) fn next_deadline(
              now: Instant,
              report_deadline: Option<Instant>,
              fired_at: Option<Instant>,
              checkpoints: &[PointerRamfbDelayCheckpoint],
          ) -> Option<Instant> {
              let checkpoint_deadline = fired_at.and_then(|fired_at| {
                  checkpoints
                      .iter()
                      .find(|checkpoint| !checkpoint.emitted)
                      .and_then(|checkpoint| fired_at.checked_add(checkpoint.delay))
              });
              [report_deadline, checkpoint_deadline]
                  .into_iter()
                  .flatten()
                  .filter(|deadline| *deadline > now)
                  .min()
          }
          """
          )
          PY

          cargo fmt --all
          python3 .github/scripts/apply-pointer-earliest-deadline.py budgets
          rm -f \
            .github/scripts/apply-pointer-earliest-deadline.py \
            .github/workflows/takeover-pointer-deadline.yml

          cargo test -p bridgevm-hvf --example hvf_gic_boot_probe --locked \
            pending_pointer_wake_uses_the_earliest_future_deadline
          cargo check -p bridgevm-hvf --example hvf_gic_boot_probe --locked
          scripts/check-refactor-budgets.sh
          git diff --check

          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "pointer: wake for the earliest pending deadline [pointer-deadline-complete]" \
            -m "Choose the minimum future deadline across HID report pacing and RAMFB checkpoints while extracting checkpoint timing into its own module so the existing pointer input file shrinks rather than raising its structural budget."
          git push origin HEAD:takeover/pointer-earliest-wake-deadline