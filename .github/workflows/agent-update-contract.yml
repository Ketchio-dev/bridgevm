name: Guest tools update contract
on: {push: {branches: [main]}, pull_request: {paths: ['scripts/test-bvagent-update.ps1', 'scripts/win-assets/bvagent-update.ps1', 'scripts/win-assets/bvagent.ps1', '.github/workflows/agent-update-contract.yml']}}
permissions:
  contents: read
jobs:
  agent-update:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Arm, guard, Confirm and rollback, with real ACLs, under Windows PowerShell 5.1
        shell: powershell
        run: scripts/test-bvagent-update.ps1
      - name: The same under PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: scripts/test-bvagent-update.ps1
