name: Normal-app native UI host contracts
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
# The macOS native host contracts run in ci.yml, job "macOS host contracts".
jobs:
  queue-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Original and versioned diagnostic queue contracts (no app launch)
        run: |
          for contract in app-ui-tier-smoke app-ui-host-tier-smoke app-ui-host-model-creations-contract app-ui-host-v2-tier-smoke app-ui-host-v2-restart-count-contract app-ui-install-cancel-tier-smoke; do python3 "tests/integration/$contract.py" || exit $?; done
