name: Installed guest input queue contracts
on: {push: {}, pull_request: {paths: ['scripts/live-gates/guest_input_*', 'tests/integration/guest-input-queue-test.py', '.github/workflows/guest-input-queue.yml']}}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python tests/integration/guest-input-queue-test.py
