name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build without publishing
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - name: Configure packaging paths
        run: |
          echo "BRIDGEVM_3D_DIR=$RUNNER_TEMP/bridgevm-3d" >> "$GITHUB_ENV"
          echo "BRIDGEVM_VENUS_PREFIX=$RUNNER_TEMP/bridgevm-3d/prefix" >> "$GITHUB_ENV"

      - name: Configure release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z]+)*$ ]]; then
            echo "invalid release version: $version" >&2
            exit 2
          fi
          echo "BRIDGEVM_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "BRIDGEVM_RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Verify the general-preview source boundary
        run: |
          python3 scripts/render-capability-status.py --check
          python3 scripts/generate-general-preview-manifest.py --self-test
          bash tests/integration/hvf-windows-product-injection-deny-smoke.sh
          bash tests/integration/install-verify-smoke.sh

      - name: Install packaging dependencies
        run: |
          brew install meson ninja pkgconf libepoxy molten-vk vulkan-loader vulkan-headers swtpm
          python3 -m pip install --break-system-packages pyyaml

      - name: Build patched renderer
        run: scripts/build-venus-host-deps.sh

      - name: Build and package the app
        run: |
          BRIDGEVM_BUNDLE_SHORT_VERSION="$BRIDGEVM_RELEASE_VERSION" \
            bash apps/macos/scripts/package-hvf-control-app.sh --output "$RUNNER_TEMP/BridgeVM.app"

      - name: Verify third-party notices
        run: bash scripts/verify-app-third-party-notices.sh "$RUNNER_TEMP/BridgeVM.app"

      - name: Refuse Windows kernel packages in the general artifact
        run: |
          found="$(find "$RUNNER_TEMP/BridgeVM.app" -type f \( \
            -iname '*.sys' -o -iname '*.cat' -o -iname '*.inf' -o \
            -iname '*.cer' -o -iname '*.pfx' -o -iname '*.p12' \
            \) -print -quit)"
          if [[ -n "$found" ]]; then
            echo "general preview contains a Windows kernel package file: $found" >&2
            exit 1
          fi

      - name: Produce tarball and dmg
        run: |
          bash scripts/package-tarball.sh --app "$RUNNER_TEMP/BridgeVM.app" \
            --output "$RUNNER_TEMP/dist/BridgeVM-${BRIDGEVM_RELEASE_TAG}.tar.gz"
          bash scripts/package-dmg.sh --app "$RUNNER_TEMP/BridgeVM.app" \
            --output "$RUNNER_TEMP/dist/BridgeVM-${BRIDGEVM_RELEASE_TAG}.dmg"

      - name: Write the general-preview release contract
        run: |
          python3 scripts/generate-general-preview-manifest.py \
            --version "$BRIDGEVM_RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/dist/BridgeVM-release.json"
          python3 -m json.tool "$RUNNER_TEMP/dist/BridgeVM-release.json" >/dev/null

      - name: Record checksums
        run: |
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 BridgeVM-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write draft release notes
        run: |
          cat > "$RUNNER_TEMP/dist/RELEASE_NOTES.md" <<EOF
          ## BridgeVM General Preview

          This is an **Engineering Preview** for Apple-silicon Macs. The general
          artifact contains no Windows kernel driver and exposes Windows install
          and import only in 3D-off mode. It does not enable TESTSIGNING or weaken
          Secure Boot policy.

          The macOS app is ad-hoc signed, not Developer ID signed or notarized.
          Read the installation and trust boundary before publishing this draft:
          https://github.com/Ketchio-dev/bridgevm/blob/${GITHUB_SHA}/docs/install.md

          ### SHA-256

          \`\`\`text
          $(cat "$RUNNER_TEMP/dist/SHA256SUMS")
          \`\`\`
          EOF

      - name: Attach to the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ runner.temp }}/dist/*
          name: BridgeVM ${{ env.BRIDGEVM_RELEASE_TAG }} — General Preview
          body_path: ${{ runner.temp }}/dist/RELEASE_NOTES.md
          draft: true

      - name: Retain dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BridgeVM-release-dry-run
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
