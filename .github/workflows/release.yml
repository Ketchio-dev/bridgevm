name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and package the app
        run: bash apps/macos/scripts/package-hvf-control-app.sh --output "$RUNNER_TEMP/BridgeVM.app"

      - name: Verify third-party notices
        run: bash scripts/verify-app-third-party-notices.sh "$RUNNER_TEMP/BridgeVM.app"

      - name: Produce tarball and dmg
        run: |
          bash scripts/package-tarball.sh --app "$RUNNER_TEMP/BridgeVM.app" \
            --output "$RUNNER_TEMP/dist/BridgeVM-${GITHUB_REF_NAME}.tar.gz"
          bash scripts/package-dmg.sh --app "$RUNNER_TEMP/BridgeVM.app" \
            --output "$RUNNER_TEMP/dist/BridgeVM-${GITHUB_REF_NAME}.dmg"

      - name: Record checksums
        run: |
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/dist/*
          body_path: ${{ runner.temp }}/dist/SHA256SUMS
          draft: true
