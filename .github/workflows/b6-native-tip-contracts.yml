name: B6 native tip contracts
on: {push: {branches: [main]}, pull_request: {paths: ['.github/actions/b6-tip-contracts/**', 'scripts/win-assets/bv-b6-native-*', 'scripts/win-assets/bv-b6-physical-uia.cs', 'scripts/win-assets/bv-b6-tip-*', 'tests/integration/b6-physical-uia-contract.*', 'tests/integration/b6-tip-*', '.github/workflows/b6-native-tip-contracts.yml']}}
permissions:
  contents: read
jobs:
  windows-native-point:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/b6-tip-contracts
        with: { mode: native }
