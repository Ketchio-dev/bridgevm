name: B6 native tip contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-native-point:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/b6-tip-contracts
        with: { mode: native }
