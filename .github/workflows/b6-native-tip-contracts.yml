name: B6 native tip contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-native-point:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - shell: powershell
        run: tests/integration/b6-tip-point-contract.ps1 -Query scripts/win-assets/bv-b6-native-tip-point.ps1
