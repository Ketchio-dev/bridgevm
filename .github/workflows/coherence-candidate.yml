name: Coherence isolated native candidate contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tests/integration/coherence-candidate-test.py && python tests/integration/coherence-fixture-readiness-test.py
  declarations:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: scripts/test-coherence-candidate.ps1
      - shell: pwsh
        run: scripts/test-coherence-candidate.ps1
