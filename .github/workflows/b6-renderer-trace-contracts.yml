name: B6 renderer trace contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  trace-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tests/integration/b6-renderer-trace-contract.py && python3 tests/integration/b6-renderer-trace-prefix-contract.py
      - run: python3 tests/integration/b6-cell-observation-contract.py
      - run: bash -n scripts/live-gates/run-tier.sh scripts/live-gates/bridgevm-live
