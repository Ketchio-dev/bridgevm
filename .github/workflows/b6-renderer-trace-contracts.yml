name: B6 renderer trace contracts
on:
  push:
  pull_request: {paths: ['scripts/live-gates/b6_*', 'scripts/live-gates/bridgevm-live', 'scripts/live-gates/redact-receipt.py', 'scripts/live-gates/run-b6-*', 'scripts/live-gates/run-tier.sh', 'tests/integration/b6-cell-observation-contract.py', 'tests/integration/b6-renderer-trace-*', 'tests/integration/b6-untraced-startup-contract.py', '.github/workflows/b6-renderer-trace-contracts.yml']}
permissions:
  contents: read
jobs:
  trace-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tests/integration/b6-renderer-trace-contract.py && python3 tests/integration/b6-renderer-trace-prefix-contract.py
      - run: python3 tests/integration/b6-cell-observation-contract.py && python3 tests/integration/b6-untraced-startup-contract.py
      - run: bash -n scripts/live-gates/run-tier.sh scripts/live-gates/bridgevm-live
