name: One-shot virtio-console read-into verifier

on:
  push:
    branches:
      - perf/virtio-console-read-into

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Replace temporary guest reads and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          test_source = base64.b64decode('').decode()

          virtqueue = Path('crates/bridgevm-hvf/src/virtio_console/virtqueue.rs')
          text = virtqueue.read_text()
          import_anchor = 'use crate::fwcfg::GuestMemoryMut;\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('virtio-console import anchor changed')
          text = text.replace(import_anchor, import_anchor + 'use crate::guest_memory::append_guest_bytes_bounded;\n', 1)
          if text.count(old) != 1:
              raise SystemExit('virtio-console read-chain anchor changed')
          virtqueue.write_text(text.replace(old, new, 1))

          tests_mod = Path('crates/bridgevm-hvf/src/virtio_console/tests/mod.rs')
          mod_text = tests_mod.read_text()
          mod_anchor = 'mod queue_pending;\n'
          if mod_text.count(mod_anchor) != 1 or 'mod read_into;' in mod_text:
              raise SystemExit('virtio-console test module anchor changed')
          tests_mod.write_text(mod_text.replace(mod_anchor, mod_anchor + 'mod read_into;\n', 1))

          test_path = Path('crates/bridgevm-hvf/src/virtio_console/tests/read_into.rs')
          if test_path.exists():
              raise SystemExit('virtio-console read-into regression already exists')
          test_path.write_text(test_source)

          declaration = re.compile(r'^\s*(?:(?:pub\s+)?(?:mod|use)\s+[^;{]*;|#\[path\s*=\s*[^]]*\])\s*$')
          def structural_loc(path: str) -> int:
              header = True
              loc = 0
              for line in Path(path).read_text().splitlines():
                  if header and re.match(r'^\s*//!', line):
                      continue
                  if header and re.match(r'^\s*$', line):
                      header = False
                      continue
                  header = False
                  if declaration.match(line):
                      continue
                  loc += 1
              return loc

          budgets_path = Path('scripts/refactor-budgets.tsv')
          budgets = budgets_path.read_text()
          source_path = 'crates/bridgevm-hvf/src/virtio_console/virtqueue.rs'
          source_pattern = re.compile(rf'^{re.escape(source_path)}\t(\d+)\t0$', re.MULTILINE)
          source_match = source_pattern.search(budgets)
          if source_match is None:
              raise SystemExit('virtio-console virtqueue budget row missing')
          source_loc = structural_loc(source_path)
          if source_loc > int(source_match.group(1)):
              raise SystemExit('virtio-console optimization unexpectedly grew source debt')
          budgets = source_pattern.sub(f'{source_path}\t{source_loc}\t0', budgets, count=1)
          test_rel = str(test_path)
          if re.search(rf'^{re.escape(test_rel)}\t', budgets, re.MULTILINE):
              raise SystemExit('virtio-console read-into test budget already exists')
          anchor = 'crates/bridgevm-hvf/src/virtio_console/tests/queue_pending.rs\t43\t0\n'
          if budgets.count(anchor) != 1:
              raise SystemExit('virtio-console budget insertion anchor changed')
          budgets = budgets.replace(anchor, anchor + f'{test_rel}\t{structural_loc(test_rel)}\t0\n', 1)
          budgets_path.write_text(budgets)
          PY

          cargo fmt --all
          for attempt in $(seq 1 10); do
            echo "virtio-console read-into regression attempt ${attempt}/10"
            cargo test -p bridgevm-hvf --locked read_chain_into_reads_descriptors_and_payload_without_read_bytes
          done
          cargo test -p bridgevm-hvf --locked
          cargo clippy -p bridgevm-hvf --all-targets --locked -- -D warnings
          scripts/check-refactor-budgets.sh
          git diff --check

          rm -f .github/workflows/perf-virtio-console-read-into.yml
          git add -A
          git config user.name Ketchio-dev
          git config user.email 116458462+Ketchio-dev@users.noreply.github.com
          git commit -m 'console: gather TX payloads directly into reusable scratch [console-read-into-complete]' -m 'Reuse the bounded guest-memory append helper for console TX chains, proving both descriptor and payload reads stay on read_into while retaining overflow, maximum-length, unbacked-range, and scratch rollback behavior.'
          git push origin HEAD:perf/virtio-console-read-into
