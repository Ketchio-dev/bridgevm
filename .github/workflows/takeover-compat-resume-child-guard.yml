name: One-shot compatibility resume child guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'takeover/compat-resume-child-guard'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply and verify supervised resume child ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lifecycle = Path("crates/bridgevm-daemon/src/backend_lifecycle.rs")
          main = Path("crates/bridgevm-daemon/src/main.rs")
          resume = Path("crates/bridgevm-daemon/src/compatibility_resume.rs")

          text = lifecycle.read_text()
          moved_imports = [
              "use bridgevm_api::build_compatibility_resume_command;\n",
              "use bridgevm_api::compat_suspend_marker_path;\n",
              "use bridgevm_api::compatibility_launch_dependency_blockers;\n",
              "use bridgevm_api::compatibility_launch_readiness_metadata;\n",
              "use bridgevm_api::verify_compatibility_resume_loaded;\n",
              "use bridgevm_qemu::assign_free_vnc_display;\n",
              "use bridgevm_storage::RunnerMetadata;\n",
              "use std::fs;\n",
              "use std::path::Path;\n",
              "use std::process::Command;\n",
              "use std::process::Stdio;\n",
          ]
          for line in moved_imports:
              if text.count(line) != 1:
                  raise SystemExit(f"moved import anchor changed: {line.strip()}")
              text = text.replace(line, "", 1)

          start_anchor = "    pub(crate) fn resume_compatibility_supervised("
          end_anchor = "    pub(crate) fn cleanup_owned_backend("
          start = text.find(start_anchor)
          end = text.find(end_anchor, start)
          if start < 0 or end < 0:
              raise SystemExit("compatibility resume function anchors changed")
          text = text[:start] + text[end:]
          lifecycle.write_text(text)

          main_text = main.read_text()
          anchor = "mod backend_lifecycle;\n"
          if main_text.count(anchor) != 1:
              raise SystemExit("daemon module anchor changed")
          main.write_text(main_text.replace(anchor, anchor + "mod compatibility_resume;\n", 1))

          resume.write_text(
              '''//! Supervised Compatibility Mode resume and pre-ownership child cleanup.

          use crate::*;
          use anyhow::{Context, Result};
          use bridgevm_api::{
              build_compatibility_resume_command, compat_suspend_marker_path,
              compatibility_launch_dependency_blockers, compatibility_launch_readiness_metadata,
              verify_compatibility_resume_loaded, BridgeVmResponse,
          };
          use bridgevm_qemu::assign_free_vnc_display;
          use bridgevm_storage::{RunnerMetadata, VmRuntimeState};
          use std::fs;
          use std::path::Path;
          use std::process::{Child, Command, Stdio};

          struct PendingChild {
              child: Option<Child>,
          }

          impl PendingChild {
              fn new(child: Child) -> Self {
                  Self { child: Some(child) }
              }

              fn child_mut(&mut self) -> &mut Child {
                  self.child.as_mut().expect("pending child must exist")
              }

              fn id(&self) -> u32 {
                  self.child.as_ref().expect("pending child must exist").id()
              }

              fn commit(mut self) -> Child {
                  self.child.take().expect("pending child must exist")
              }
          }

          impl Drop for PendingChild {
              fn drop(&mut self) {
                  let Some(child) = self.child.as_mut() else {
                      return;
                  };
                  if child.try_wait().ok().flatten().is_none() {
                      let _ = child.kill();
                      let _ = child.wait();
                  }
              }
          }

          impl DaemonState {
              pub(crate) fn resume_compatibility_supervised(
                  &mut self,
                  name: &str,
                  bundle: &Path,
                  manifest: &bridgevm_config::VmManifest,
              ) -> Result<BridgeVmResponse> {
                  let marker_path = compat_suspend_marker_path(bundle, name);
                  if !marker_path.exists() {
                      anyhow::bail!(
                          "no saved Compatibility Mode state to resume from at {}; suspend the VM first",
                          marker_path.display()
                      );
                  }
                  let (disk, active_disk) = self
                      .store
                      .prepare_active_disk(name)
                      .context("failed to prepare active disk")?;
                  if !disk.exists {
                      anyhow::bail!("active disk is not ready: {}", disk.path.display());
                  }
                  let readiness = compatibility_launch_readiness_metadata(
                      &disk,
                      compatibility_launch_dependency_blockers(manifest, bundle),
                  );
                  if !readiness.ready {
                      anyhow::bail!(
                          "Compatibility Mode launch readiness failed: {}",
                          launch_readiness_blocker_summary(&readiness)
                      );
                  }

                  let mut command = build_compatibility_resume_command(manifest, bundle)
                      .map_err(|error| anyhow::anyhow!("{error}"))?;
                  let avoid = self.live_vnc_displays();
                  assign_free_vnc_display(&mut command, &avoid)
                      .map_err(|error| anyhow::anyhow!(error))?;
                  let log_path = bundle.join("logs").join("qemu.log");
                  let guest_tools = self
                      .store
                      .guest_tools_runner_metadata(name)
                      .context("failed to prepare guest tools runner metadata")?;
                  let qmp_supervisor = self
                      .store
                      .qmp_supervisor_metadata(name)
                      .context("failed to read QMP supervisor metadata")?;
                  fs::create_dir_all(bundle.join("logs"))
                      .context("failed to create VM log directory")?;
                  let stdout = fs::OpenOptions::new()
                      .create(true)
                      .append(true)
                      .open(&log_path)
                      .context("failed to open QEMU log file")?;
                  let stderr = stdout
                      .try_clone()
                      .context("failed to clone QEMU log file")?;
                  let child = Command::new(&command.program)
                      .args(&command.args)
                      .stdout(Stdio::from(stdout))
                      .stderr(Stdio::from(stderr))
                      .spawn()
                      .with_context(|| format!("failed to spawn {}", command.program))?;
                  let mut pending_child = PendingChild::new(child);
                  verify_compatibility_resume_loaded(
                      pending_child.child_mut(),
                      bundle,
                      &log_path,
                  )
                  .map_err(anyhow::Error::msg)?;

                  let metadata = RunnerMetadata {
                      engine: "fullvm".to_string(),
                      pid: Some(pending_child.id()),
                      command: command.render_shell_words(),
                      log_path,
                      started_at_unix: now_unix(),
                      dry_run: false,
                      launch_spec_path: None,
                      guest_tools: Some(guest_tools),
                      disk: Some(disk),
                      active_disk: Some(active_disk),
                      launch_readiness: None,
                      runtime_control: None,
                  };
                  self.store
                      .write_runner_metadata(name, &metadata)
                      .context("failed to write runner metadata")?;
                  if let Err(error) = self.store.transition_state(name, VmRuntimeState::Running) {
                      let rollback = self.store.clear_runner_metadata(name);
                      if let Err(rollback_error) = rollback {
                          anyhow::bail!(
                              "failed to mark VM running: {error}; runner metadata rollback also failed: {rollback_error}"
                          );
                      }
                      anyhow::bail!("failed to mark VM running: {error}");
                  }

                  let child = pending_child.commit();
                  self.children
                      .insert(name.to_string(), SupervisedBackend::new(child));
                  if let Err(error) = fs::remove_file(&marker_path) {
                      eprintln!(
                          "bridgevmd resume: VM '{name}' is running but the consumed suspend marker could not be removed at {}: {error}",
                          marker_path.display()
                      );
                  }

                  Ok(BridgeVmResponse::RunnerStatus {
                      metadata: Some(metadata),
                      qmp_supervisor,
                  })
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use std::env;
              use std::thread;
              use std::time::{Duration, SystemTime, UNIX_EPOCH};

              fn marker_path(label: &str) -> std::path::PathBuf {
                  let nonce = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .unwrap()
                      .as_nanos();
                  env::temp_dir().join(format!(
                      "bridgevm-{label}-{}-{nonce}",
                      std::process::id()
                  ))
              }

              #[test]
              fn uncommitted_resume_child_is_killed_on_drop() {
                  let marker = marker_path("pending-child");
                  let _ = fs::remove_file(&marker);
                  let child = Command::new("sh")
                      .arg("-c")
                      .arg("sleep 0.2; : > \"$1\"")
                      .arg("bridgevm-pending-child")
                      .arg(&marker)
                      .spawn()
                      .unwrap();

                  drop(PendingChild::new(child));
                  thread::sleep(Duration::from_millis(300));

                  assert!(!marker.exists(), "uncommitted child escaped cleanup");
              }

              #[test]
              fn committed_resume_child_is_transferred_to_the_caller() {
                  let child = Command::new("sh")
                      .arg("-c")
                      .arg("exit 0")
                      .spawn()
                      .unwrap();
                  let mut child = PendingChild::new(child).commit();
                  assert!(child.wait().unwrap().success());
              }
          }
          '''.replace("          ", "")
          )
          PY

          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          import re

          target = "crates/bridgevm-daemon/src/compatibility_resume.rs"
          anchor = "crates/bridgevm-daemon/src/backend_lifecycle.rs"
          budget = Path("scripts/refactor-budgets.tsv")
          source = Path(target)
          declaration = re.compile(
              r"^\s*((pub\s+)?(mod|use)\s+[^;{]*;|#\[path\s*=.*\])\s*$"
          )

          def measured_loc(path: Path) -> int:
              loc = 0
              header = True
              for line in path.read_text().splitlines():
                  if header and line.lstrip().startswith("//!"):
                      continue
                  if header and not line.strip():
                      header = False
                      continue
                  header = False
                  if declaration.match(line):
                      continue
                  loc += 1
              return loc

          lines = budget.read_text().splitlines()
          if any(line.split("\t", 1)[0] == target for line in lines):
              raise SystemExit(f"budget already contains {target}")
          index = next(
              (i for i, line in enumerate(lines) if line.split("\t", 1)[0] == anchor),
              None,
          )
          if index is None:
              raise SystemExit("daemon budget anchor missing")
          lines.insert(index + 1, f"{target}\t{measured_loc(source)}\t0")
          budget.write_text("\n".join(lines) + "\n")
          PY

          rm -f .github/workflows/takeover-compat-resume-child-guard.yml
          cargo test -p bridgevm-daemon --locked uncommitted_resume_child_is_killed_on_drop
          cargo test -p bridgevm-daemon --locked committed_resume_child_is_transferred_to_the_caller
          cargo check -p bridgevm-daemon --locked
          scripts/check-refactor-budgets.sh
          git diff --check

          git add -A
          git config user.name "Ketchio-dev"
          git config user.email "116458462+Ketchio-dev@users.noreply.github.com"
          git commit \
            -m "daemon: guard uncommitted compatibility resume children [compat-resume-guard-complete]" \
            -m "Keep resumed QEMU under an RAII kill-and-wait guard until runner metadata and the running-state transition both succeed. Roll metadata back on transition failure and consume the suspend marker only after daemon ownership is committed."
          git push origin HEAD:takeover/compat-resume-child-guard