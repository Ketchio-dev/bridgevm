name: B6 frame-time contracts

on:
  push: {branches: [main]}
  pull_request: {paths: ['scripts/analyze-b6-frame-times.py', 'scripts/b6_frame_times.py', 'tests/integration/b6-frame-time-contract.py', '.github/workflows/b6-frame-time-contracts.yml']}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-time:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject invalid frame evidence and test fixed arithmetic comparisons
        run: python3 tests/integration/b6-frame-time-contract.py
